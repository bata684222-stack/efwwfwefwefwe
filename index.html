/* ================= РЕДАКТОР ПОСТРОЕК (С НАСТРОЙКОЙ ШИРИНЫ/ВЫСОТЫ, PLATE И ЭКСПОРТОМ НА ANDROID) ================= */
let BW=110, BH=72, BCS=7;
let bldGrid=new Uint8Array(BW*BH);
const bldHist=[], bldRedoStack=[];
let bldTool='brush', bldMat=M.CONC, bldSz=2, bldSq=true, bldDown=false, bldStart=null, bldCur={x:55,y:36}, bldRightErase=false;
const bldc=$('bldc');bldc.width=BW*BCS;bldc.height=BH*BCS;
const bx=bldc.getContext('2d');

function resizeBldGrid(newW,newH){
  const next=new Uint8Array(newW*newH);
  const mw=Math.min(BW,newW), mh=Math.min(BH,newH);
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++)next[y*newW+x]=bldGrid[y*BW+x];
  BW=newW;BH=newH;bldGrid=next;
  BCS=Math.max(5,Math.min(9,Math.floor(760/Math.max(BW,BH))));
  bldc.width=BW*BCS;bldc.height=BH*BCS;
  $('bldwv').textContent=BW;
  $('bldhv').textContent=BH;
  bldDraw();
}

function bldPushHist(){
  bldHist.push(new Uint8Array(bldGrid));
  if(bldHist.length>20)bldHist.shift();
  bldRedoStack.length=0;
}
function bldSetSize(v){
  bldSz=Math.max(1,Math.min(15,v|0));
  $('bldsz').value=bldSz;
  $('bldszv').textContent=bldSz;
  bldUpdateBadge();
}
function bldUpdateBadge(extra){
  const d=bldSz*2-1;
  const mName=bldTool==='erase'?'Ластик':MAT[bldMat].n;
  $('bldinfo').textContent=(extra||(bldTool.toUpperCase()+' '+d+'x'+d+' кл.'))+' · '+mName;
}

function getBldCells(tMode,x0,y0,x1,y1,r,sq){
  const out=[];
  const addB=(cx,cy)=>{
    const R=r-1;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      if(!sq&&dx*dx+dy*dy>R*R+0.35)continue;
      out.push(cx+dx,cy+dy);
    }
  };
  if(tMode==='brush'||tMode==='erase'){
    addB(x1,y1);
  }else if(tMode==='line'){
    const dx=x1-x0,dy=y1-y0,st=Math.max(1,Math.hypot(dx,dy)|0);
    for(let s=0;s<=st;s++)addB(Math.round(x0+dx*s/st),Math.round(y0+dy*s/st));
  }else if(tMode==='plate'){
    const dx=x1-x0,dy=y1-y0,len=Math.hypot(dx,dy);
    const halfT=Math.max(0.5,(r-0.5));
    if(len<1){
      for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)out.push(x0+x,y0+y);
    }else{
      const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
      const minX=Math.floor(Math.min(x0,x1)-halfT-1),maxX=Math.ceil(Math.max(x0,x1)+halfT+1);
      const minY=Math.floor(Math.min(y0,y1)-halfT-1),maxY=Math.ceil(Math.max(y0,y1)+halfT+1);
      for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
        const px_=x-x0,py_=y-y0;
        const projU=px_*ux+py_*uy, projV=px_*nx+py_*ny;
        if(projU>=-0.5&&projU<=len+0.5&&Math.abs(projV)<=halfT)out.push(x,y);
      }
    }
  }else if(tMode==='rect'||tMode==='box'){
    const ax=Math.min(x0,x1),bx_=Math.max(x0,x1),ay=Math.min(y0,y1),by=Math.max(y0,y1),th=Math.max(1,r);
    for(let y=ay;y<=by;y++)for(let x=ax;x<=bx_;x++){
      if(tMode==='box'&&x>=ax+th&&x<=bx_-th&&y>=ay+th&&y<=by-th)continue;
      out.push(x,y);
    }
  }else if(tMode==='circle'){
    const rx=Math.max(1,Math.abs(x1-x0)),ry=Math.max(1,Math.abs(y1-y0));
    for(let dy=-ry;dy<=ry;dy++)for(let dx=-rx;dx<=rx;dx++){
      if((dx*dx)/(rx*rx)+(dy*dy)/(ry*ry)<=1.05)out.push(x0+dx,y0+dy);
    }
  }
  return out;
}

function bldFloodFill(sx,sy,newMat){
  if(sx<0||sy<0||sx>=BW||sy>=BH)return;
  const target=bldGrid[sy*BW+sx];
  if(target===newMat)return;
  const vis=new Uint8Array(BW*BH),q=new Int32Array(BW*BH);
  let h=0,t=0;
  vis[sy*BW+sx]=1;q[t++]=sy*BW+sx;
  while(h<t){
    const c=q[h++],x=c%BW,y=(c/BW)|0;
    bldGrid[c]=newMat;
    if(x>0&&!vis[c-1]&&bldGrid[c-1]===target){vis[c-1]=1;q[t++]=c-1;}
    if(x<BW-1&&!vis[c+1]&&bldGrid[c+1]===target){vis[c+1]=1;q[t++]=c+1;}
    if(y>0&&!vis[c-BW]&&bldGrid[c-BW]===target){vis[c-BW]=1;q[t++]=c-BW;}
    if(y<BH-1&&!vis[c+BW]&&bldGrid[c+BW]===target){vis[c+BW]=1;q[t++]=c+BW;}
  }
}

function bldDraw(){
  bx.fillStyle='#06080c';bx.fillRect(0,0,bldc.width,bldc.height);
  for(let y=0;y<BH;y++)for(let x=0;x<BW;x++){
    const m=bldGrid[y*BW+x];
    if(m){const c=MAT[m].c;bx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';bx.fillRect(x*BCS,y*BCS,BCS,BCS);}
  }
  bx.strokeStyle='rgba(40,50,70,0.45)';bx.lineWidth=1;bx.beginPath();
  for(let x=0;x<=BW;x++){bx.moveTo(x*BCS+.5,0);bx.lineTo(x*BCS+.5,bldc.height);}
  for(let y=0;y<=BH;y++){bx.moveTo(0,y*BCS+.5);bx.lineTo(bldc.width,y*BCS+.5);}
  bx.stroke();

  bx.strokeStyle='rgba(217,138,43,0.55)';bx.beginPath();
  bx.moveTo(0,(BH-1)*BCS);bx.lineTo(bldc.width,(BH-1)*BCS);bx.stroke();

  if(bldTool==='mannequin'){
    bx.globalAlpha=0.65;
    drawMannequin((x,y,m)=>{
      if(x<0||y<0||x>=BW||y>=BH||!m)return;
      const c=MAT[m].c;bx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
      bx.fillRect(x*BCS,y*BCS,BCS,BCS);
    },bldCur.x,bldCur.y);
    bx.globalAlpha=1;
  }else if(bldTool!=='fill'){
    const x0=(bldDown&&bldStart)?bldStart.x:bldCur.x;
    const y0=(bldDown&&bldStart)?bldStart.y:bldCur.y;
    const effT=bldRightErase?'erase':bldTool;
    const cells=getBldCells(effT,x0,y0,bldCur.x,bldCur.y,bldSz,bldSq);
    const mc=MAT[bldMat].c;
    bx.fillStyle=(effT==='erase')?'rgba(255,75,70,0.55)':'rgba('+mc[0]+','+mc[1]+','+mc[2]+',0.62)';
    for(let i=0;i<cells.length;i+=2){
      const x=cells[i],y=cells[i+1];
      if(x>=0&&y>=0&&x<BW&&y<BH)bx.fillRect(x*BCS,y*BCS,BCS,BCS);
    }
    if(bldDown&&bldStart&&(bldTool==='rect'||bldTool==='box'||bldTool==='line'||bldTool==='plate'||bldTool==='circle')){
      bldUpdateBadge('Размер: '+(Math.abs(bldCur.x-x0)+1)+'x'+(Math.abs(bldCur.y-y0)+1)+' кл.');
    }
  }
}

function bldPos(e){
  const r=bldc.getBoundingClientRect();
  const x=Math.max(0,Math.min(BW-1,(((e.clientX-r.left)/r.width)*BW)|0));
  const y=Math.max(0,Math.min(BH-1,(((e.clientY-r.top)/r.height)*BH)|0));
  return {x,y};
}
function bldApplyBrush(p){
  const effT=bldRightErase?'erase':bldTool;
  const cells=getBldCells(effT,p.x,p.y,p.x,p.y,bldSz,bldSq);
  const val=effT==='erase'?0:bldMat;
  for(let i=0;i<cells.length;i+=2){
    const x=cells[i],y=cells[i+1];
    if(x>=0&&y>=0&&x<BW&&y<BH)bldGrid[y*BW+x]=val;
  }
}

bldc.addEventListener('contextmenu',e=>e.preventDefault());
bldc.addEventListener('wheel',e=>{
  e.preventDefault();
  bldSetSize(bldSz+(e.deltaY<0?1:-1));
  bldDraw();
},{passive:false});

bldc.addEventListener('pointerdown',e=>{
  e.preventDefault();
  try{bldc.setPointerCapture(e.pointerId);}catch(_){}
  const p=bldPos(e);bldCur=p;bldStart=p;bldDown=true;
  bldRightErase=(e.button===2);
  bldPushHist();
  if(bldRightErase||bldTool==='brush'||bldTool==='erase'){
    bldApplyBrush(p);
  }else if(bldTool==='fill'){
    bldFloodFill(p.x,p.y,bldMat);
    bldDown=false;
  }else if(bldTool==='mannequin'){
    drawMannequin((x,y,m)=>{if(x>=0&&y>=0&&x<BW&&y<BH&&m)bldGrid[y*BW+x]=m;},p.x,p.y);
    bldDown=false;
  }
  bldDraw();
});
bldc.addEventListener('pointermove',e=>{
  const p=bldPos(e);bldCur=p;
  if(bldDown&&(bldRightErase||bldTool==='brush'||bldTool==='erase')){
    const dx=p.x-bldStart.x,dy=p.y-bldStart.y,st=Math.max(1,Math.hypot(dx,dy)|0);
    for(let s=1;s<=st;s++)bldApplyBrush({x:Math.round(bldStart.x+dx*s/st),y:Math.round(bldStart.y+dy*s/st)});
    bldStart=p;
  }
  bldDraw();
});
bldc.addEventListener('pointerup',()=>{
  if(!bldDown)return;
  if(!bldRightErase&&(bldTool==='line'||bldTool==='plate'||bldTool==='rect'||bldTool==='box'||bldTool==='circle')&&bldStart){
    const cells=getBldCells(bldTool,bldStart.x,bldStart.y,bldCur.x,bldCur.y,bldSz,bldSq);
    for(let i=0;i<cells.length;i+=2){
      const x=cells[i],y=cells[i+1];
      if(x>=0&&y>=0&&x<BW&&y<BH)bldGrid[y*BW+x]=bldMat;
    }
  }
  bldDown=false;bldStart=null;bldRightErase=false;
  bldUpdateBadge();bldDraw();
});

    b.onclick=()=>{
      bldPushHist();bldGrid.fill(0);
      const t=b.dataset.tpl, cx=(BW/2)|0, cy=BH-2;
      const put=(x,y,m)=>{if(x>=0&&y>=0&&x<BW&&y<BH&&m)bldGrid[y*BW+x]=m;};
      if(t==='house')drawHouse(put,cx,cy);
      else if(t==='five')drawFiveStory(put,cx,cy);
      else if(t==='tank')drawTank(put,cx,cy);
      else if(t==='plane')drawPlane(put,cx,cy);
      bldDraw();
    };
  });
})();

function extractBldCells(){
  let x0=BW,x1=-1,y0=BH,y1=-1;
  for(let y=0;y<BH;y++)for(let x=0;x<BW;x++)if(bldGrid[y*BW+x]){
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
  }
  if(x1<0)return null;
  const cx=((x0+x1)/2)|0, cy=y1;
  const arr=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const m=bldGrid[y*BW+x];
    if(m)arr.push(x-cx,y-cy,m);
  }
  return arr;
}

function loadCellsIntoBldGrid(arr){
  bldPushHist();
  bldGrid.fill(0);
  const cx=(BW/2)|0, cy=BH-2;
  for(let i=0;i<arr.length;i+=3){
    const x=cx+arr[i],y=cy+arr[i+1],m=arr[i+2];
    if(x>=0&&y>=0&&x<BW&&y<BH)bldGrid[y*BW+x]=m;
  }
  bldDraw();
}

// Экспорт / Импорт кодом и файлом (работает на Android в любом браузере и WebView)
$('bldexport').onclick=()=>{
  const arr=extractBldCells();
  if(!arr)return;
  const data=JSON.stringify({name:$('bldname').value||'Постройка',cells:arr});
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(data).then(()=>{$('bldinfo').textContent='Код скопирован в буфер';}).catch(()=>prompt('Скопируйте код постройки:',data));
  }else{
    prompt('Скопируйте код постройки:',data);
  }
};
$('bldimport').onclick=()=>{
  const raw=prompt('Вставьте код постройки:');
  if(!raw)return;
  try{
    const obj=JSON.parse(raw);
    if(obj&&Array.isArray(obj.cells)){
      if(obj.name)$('bldname').value=obj.name;
      loadCellsIntoBldGrid(obj.cells);
      $('bldinfo').textContent='Постройка загружена из кода';
    }
  }catch(_){}
};
$('bldfiledl').onclick=()=>{
  const arr=extractBldCells();
  if(!arr)return;
  const name=($('bldname').value||'building').trim();
  const blob=new Blob([JSON.stringify({name,cells:arr})],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name+'.json';
  a.click();
};
$('bldfileul').onclick=()=>$('bldfileinp').click();
$('bldfileinp').onchange=e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      if(obj&&Array.isArray(obj.cells)){
        if(obj.name)$('bldname').value=obj.name;
        loadCellsIntoBldGrid(obj.cells);
      }
    }catch(_){}
  };
  rd.readAsText(f);
};

$('bldopen').onclick=()=>{$('bldr').classList.add('open');bldDraw();};
$('bldclose').onclick=()=>$('bldr').classList.remove('open');
$('bldstamp').onclick=()=>{
  const arr=extractBldCells();
  if(!arr)return;
  customStampCells=arr;
  tool='stamp';stampType='custom';refreshActive();
  $('bldr').classList.remove('open');
};
let customSceneNum=1;
$('bldsave').onclick=()=>{
  const arr=extractBldCells();
  if(!arr)return;
  const snap=arr.slice();
  const key='custom_bld_'+(customSceneNum);
  const name=($('bldname').value||'').trim()||('Своя #'+(customSceneNum++));
  SCENES[key]={
    n:name,
    f(){
      const ox=205,oy=LY-2;
      for(let i=0;i<snap.length;i+=3){
        const x=ox+snap[i],y=oy+snap[i+1],m=snap[i+2];
        putCell(x,y,m,y>=LY-4&&!isBio(m));
      }
    }
  };
  addSceneBtn(key,name);
  saveBuildingToStorage(name,snap);
  $('bldr').classList.remove('open');
  loadScene(key);
};

/* ================= ГОРЯЧИЕ КЛАВИШИ ================= */
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  if($('bldr').classList.contains('open')){
    if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='я')){e.preventDefault();$('bldundo').onclick();}
    else if((e.ctrlKey||e.metaKey)&&(e.key==='y'||e.key==='н')){e.preventDefault();$('bldredo').onclick();}
    else if(e.key==='Escape')$('bldr').classList.remove('open');
    return;
  }
  if(e.code==='Space'){
    e.preventDefault();audioInit();
    if(lastFire){if(lastFire.edge)fire(0,lastFire.y,0,true);else fire(lastFire.x,lastFire.y,lastFire.a,false);}
    else fire(0,WH/2,0,true);
  }else if(e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь'){
    tool='stamp';stampType='mannequin';refreshActive();
  }else if(e.key==='['||e.key==='х'){
    setBrushSize(brushR-1);
  }else if(e.key===']'||e.key==='ъ'){
    setBrushSize(brushR+1);
  }else if(e.key==='p'||e.key==='з'){
    togglePause();
  }else if(e.key==='r'||e.key==='к'){
    loadScene(sceneName);
  }else if(e.key>='1'&&e.key<='4'){
    setView(+e.key-1);
  }else if(e.key==='Escape'){
    tool='fire';refreshActive();
  }
});

/* ================= HUD И ГЛАВНЫЙ ЦИКЛ ================= */
function updateHUD(fps){
  const imp=lastShotSpeed?lastShotSpeed.toLocaleString('ru-RU'):'—';
  const pk=Math.round(20+Math.max(peakT,maxT)*2500).toLocaleString('ru-RU');
  const tu=shotFrames>=0?(shotFrames*1.3).toFixed(1):'0.0';
  $('hud').innerHTML=
   'СКОРОСТЬ <span>'+imp+' м/с</span><br>'+
   'ТЕМП. &nbsp;&nbsp;&nbsp;<span>'+pk+' °C</span><br>'+
   'ВРЕМЯ &nbsp;&nbsp;&nbsp;<span>'+tu+' мкс</span><br>'+
   'ВЗРЫВОВ &nbsp;<span>'+detCount.toLocaleString('ru-RU')+'</span><br>'+
   'ЧАСТИЦ &nbsp;&nbsp;<span>'+(nP-freePTop).toLocaleString('ru-RU')+'</span>';
  $('fps').textContent=fps+' fps · акт. '+actCount;
}

let last=performance.now(),acc=0,hudT=0,frames=0,fpsT=0,fpsV=60,repTick=0;
function loop(t){
  let dt=Math.min(.1,(t-last)/1000);last=t;
  acc+=dt;
  let n=0;
  while(acc>=1/60&&n<2){if(!paused)stepFrame();acc-=1/60;n++;}
  if(acc>1/60)acc=0;

  if(replayActive&&replayPlaying&&flightHistory.length){
    repTick++;
    if(repTick%2===0){
      replayIdx++;
      if(replayIdx>=flightHistory.length){
        replayIdx=flightHistory.length-1;
        replayPlaying=false;
        $('repPlay').textContent='Пуск';
      }
      $('repSlider').value=replayIdx;
      $('repInfo').textContent=(replayIdx+1)+' / '+flightHistory.length;
    }
  }

  render();
  frames++;fpsT+=dt;
  if(fpsT>.5){fpsV=Math.round(frames/fpsT);frames=0;fpsT=0;}
  hudT+=dt;if(hudT>.1){hudT=0;updateHUD(fpsV);}
  requestAnimationFrame(loop);
}

setTs(.5);setBrushSize(4);bldSetSize(2);syncSpeed();setView(0);
loadScene('five');
tool='fire';refreshActive();
requestAnimationFrame(loop);

})();
