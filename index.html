<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Баллистический полигон</title>
<style>
  :root{--bg:#080a0f;--panel:#0e121a;--line:#222938;--acc:#d98a2b;--acc2:#f0b35e;--txt:#d0d6e2;--dim:#7a8499}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  canvas#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
  #panel{position:fixed;left:8px;top:8px;bottom:8px;width:272px;overflow-y:auto;padding:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
    scrollbar-width:thin;scrollbar-color:#2b3347 transparent;transition:transform .2s;z-index:10;
    display:flex;flex-direction:column;gap:6px}
  #panel.hide{transform:translateX(-290px)}
  #tog{position:fixed;left:8px;top:8px;z-index:11;height:32px;padding:0 12px;border-radius:5px;border:1px solid var(--line);
    background:var(--panel);color:#fff;font-weight:600;font-size:12px;cursor:pointer;display:none}
  #panel.hide ~ #tog{display:block}
  .top-row{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .top-row b{font-size:13px;letter-spacing:.5px;color:#fff}
  #hide{background:#151b26;border:1px solid var(--line);color:var(--dim);cursor:pointer;font-size:11px;padding:3px 8px;border-radius:4px}
  .mode-bar{display:flex;gap:4px;background:#090c12;padding:4px;border-radius:5px;border:1px solid var(--line)}
  .mode-bar button{flex:1;padding:6px 4px;font-weight:600;font-size:11.5px;border-radius:4px}
  .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;background:#090c12;padding:3px;border-radius:5px;border:1px solid var(--line)}
  .tabs button{border:none;background:transparent;color:var(--dim);padding:5px 4px;font-size:11px;font-weight:600;border-radius:3px}
  .tabs button.on{background:#1c2434;color:#fff}
  .tab-sec{display:none;flex-direction:column;gap:4px}
  .tab-sec.on{display:flex}
  h3{margin:6px 0 2px;font-size:10px;letter-spacing:.8px;color:var(--dim);font-weight:700;text-transform:uppercase}
  button{font:inherit;color:var(--txt);background:#151b26;border:1px solid var(--line);border-radius:4px;padding:5px 7px;
    font-size:11.5px;cursor:pointer}
  button:hover{background:#1c2434;border-color:#36415c}
  button.on{background:#292118;border-color:var(--acc);color:#fff}
  button.bio-btn{border-color:#4d2530;background:#1f1116}
  button.bio-btn.on{background:#421924;border-color:#d94b68;color:#fff}
  button.uran-btn{border-color:#2d5432;background:#112115;color:#a8f0b0}
  button.uran-btn.on{background:#1b3d22;border-color:#5cd66f;color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
  .list{display:flex;flex-direction:column;gap:3px}
  .list button{text-align:left;display:flex;justify-content:space-between;align-items:center;gap:4px}
  .list button small{color:var(--dim);font-size:10px}
  .row{display:flex;gap:4px;flex-wrap:wrap}
  .row button{flex:1;white-space:nowrap}
  .sw{display:grid;grid-template-columns:1fr 1fr;gap:3px;max-height:195px;overflow-y:auto;padding-right:2px;scrollbar-width:thin}
  .sw button{display:flex;align-items:center;gap:5px;padding:4px 5px;font-size:11px;text-align:left}
  .sw i{width:10px;height:10px;border-radius:2px;flex:none}
  label{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:4px 0 1px}
  label b{color:var(--acc2);font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
  input[type=range]{width:100%;accent-color:var(--acc);margin:0;height:16px}
  #hud{position:fixed;right:12px;bottom:12px;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:#b8c0d0;
    background:rgba(10,13,20,.82);border:1px solid var(--line);padding:6px 8px;border-radius:4px;pointer-events:none}
  #hud span{color:var(--acc2)}
  #fps{position:fixed;right:12px;top:8px;font:11px ui-monospace,monospace;color:#6e778c;pointer-events:none}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;display:none;
    background:#0e121a;border:1px solid var(--line);border-radius:6px;padding:10px 12px;
    box-shadow:0 12px 48px rgba(0,0,0,.85);max-width:96vw;max-height:95vh;overflow-y:auto}
  .modal.open{display:block}
  .modal .edhead{font-size:12px;font-weight:700;color:#fff;margin-bottom:8px;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
  .modal .edhead .statbadge{color:var(--acc2);font-family:ui-monospace,monospace;font-size:11px;background:#151b26;
    padding:2px 6px;border-radius:3px;border:1px solid var(--line);font-weight:400}
  .modal .edhead button.closebtn{margin-left:auto}
  .ed-canvas-wrap{position:relative;display:inline-block;border:1px solid var(--line);background:#06080c}
  #edc,#bldc{cursor:crosshair;touch-action:none;display:block;max-width:100%}
  .pal-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:4px;margin:6px 0;max-width:780px}
  .pal-wrap button{display:flex;align-items:center;gap:5px;padding:5px 7px;font-size:11px;text-align:left}
  .pal-wrap i{width:11px;height:11px;border-radius:2px;flex:none}
  .bldr-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:5px 0}
  .bldr-bar .sep{width:1px;height:18px;background:var(--line)}
  .sz-pills{display:flex;gap:3px}
  .sz-pills button{padding:3px 6px;font-size:10.5px;min-width:24px}
  .proj-prev-box{display:flex;align-items:center;justify-content:space-between;background:#090c12;border:1px solid var(--line);
    border-radius:4px;padding:4px 6px;margin-top:2px}
  .proj-prev-box span{font-size:10.5px;color:var(--dim)}
  #replayBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;display:none;
    background:#0e121a;border:1px solid var(--line);border-radius:5px;padding:7px 10px;min-width:320px;max-width:92vw;
    align-items:center;gap:8px;font-size:11.5px}
  #replayBar.open{display:flex}
  input[type=text]{background:#090c12;border:1px solid var(--line);color:var(--txt);padding:4px 6px;font-size:11px;border-radius:3px}
  @media (max-width:640px){#panel{width:225px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="panel">
  <div class="top-row">
    <b>ПОЛИГОН</b>
    <div style="display:flex;gap:4px">
      <button id="pause">Пауза</button>
      <button id="reset">Сброс</button>
      <button id="hide">Скрыть</button>
    </div>
  </div>

  <!-- Быстрое переключение режима и сцен -->
  <div class="mode-bar">
    <button id="quickFire" class="on">Режим: Выстрел</button>
    <button id="clear">Очистить карту</button>
  </div>

  <div class="tabs" id="mainTabs">
    <button data-tab="tCombat" class="on">Бой и Сцены</button>
    <button data-tab="tBuild">Постройка</button>
    <button data-tab="tView">Вид и Время</button>
  </div>

  <!-- ВКЛАДКА 1: БОЙ И СЦЕНЫ -->
  <div class="tab-sec on" id="tCombat">
    <h3>Сцены</h3>
    <div class="grid2" id="scenes"></div>

    <h3>Объекты на карту</h3>
    <div class="row">
      <button id="spMan" class="bio-btn">Манекен</button>
      <button id="bldopen">Редактор построек</button>
    </div>
    <div class="grid2" id="stamps"></div>

    <h3>Снаряд</h3>
    <div class="list" id="projs"></div>
    <div class="proj-prev-box">
      <span id="projDimTxt">Размер: —</span>
      <canvas id="projPrevCv" width="110" height="44"></canvas>
    </div>
    <label>Масштаб снаряда <b id="pscalev">100%</b></label>
    <input type="range" id="pscalerng" min="50" max="160" step="10" value="100">
    <label>Скорость <b id="spdv"></b></label>
    <input type="range" id="spd" min="600" max="4200" step="50" value="2500">
    <div class="row" style="margin-top:2px">
      <button id="edopen">Редактор снаряда</button>
      <button id="replayBtn">Повтор полёта</button>
    </div>
  </div>

  <!-- ВКЛАДКА 2: ПОСТРОЙКА И БЛОКИ -->
  <div class="tab-sec" id="tBuild">
    <h3>Инструменты</h3>
    <div class="grid3" id="drawtools">
      <button data-dt="paint">Кисть</button>
      <button data-dt="plate">Плита</button>
      <button data-dt="fill">Заливка</button>
      <button data-dt="line">Линия</button>
      <button data-dt="rect">Блок</button>
      <button data-dt="box">Рамка</button>
      <button data-dt="erase">Ластик</button>
    </div>

    <label>Толщина / Размер <b id="brv">4 (7 кл.)</b></label>
    <input type="range" id="br" min="1" max="22" value="4">
    <div class="sz-pills" id="brpills">
      <button data-sz="1">1</button>
      <button data-sz="2">2</button>
      <button data-sz="4" class="on">4</button>
      <button data-sz="7">7</button>
      <button data-sz="12">12</button>
      <button data-sz="18">18</button>
    </div>
    <div class="row" style="margin-top:2px">
      <button id="bsh">Форма: Круг</button>
      <button id="pinbtn">Опора: Авто</button>
    </div>

    <h3>Материалы блоков</h3>
    <div class="row" style="margin-bottom:3px">
      <button id="quickUran" class="uran-btn">Уран-235 (ядерный блок)</button>
    </div>
    <div class="sw" id="mats"></div>
  </div>

  <!-- ВКЛАДКА 3: ВИД, КАМЕРА, ВРЕМЯ -->
  <div class="tab-sec" id="tView">
    <h3>Замедление времени</h3>
    <label>Скорость времени <b id="tsv">0.50x</b></label>
    <input type="range" id="tsrng" min="0.02" max="1.00" step="0.02" value="0.50">
    <div class="grid3" style="margin-top:2px">
      <button data-ts="0.10">0.1x</button>
      <button data-ts="0.50">0.5x</button>
      <button data-ts="1.00">1.0x</button>
    </div>

    <h3>Режим отображения</h3>
    <div class="grid2" id="views"></div>
    <div class="row" style="margin-top:2px">
      <button id="glowbtn" class="on">Свечение: Вкл</button>
      <button id="snd">Звук: Вкл</button>
    </div>
    <label>Яркость свечения <b id="glowv">22%</b></label>
    <input type="range" id="glowrng" min="0" max="100" step="2" value="22">

    <h3>Камера</h3>
    <div class="row">
      <button id="zin">Приблизить</button>
      <button id="zout">Отдалить</button>
      <button id="zreset">Сброс 1:1</button>
    </div>
  </div>
</div>
<button id="tog">Меню</button>

<!-- Панель повтора полёта снаряда -->
<div id="replayBar">
  <b>Траектория</b>
  <input type="range" id="repSlider" min="0" max="0" value="0" style="width:150px">
  <span id="repInfo" style="font-family:monospace;color:var(--acc2);min-width:95px">0 / 0</span>
  <button id="repPlay">Пуск</button>
  <button id="repClose">Закрыть</button>
</div>

<!-- Редактор снаряда -->
<div id="editor" class="modal">
  <div class="edhead">
    РЕДАКТОР СНАРЯДА (нос справа)
    <span class="statbadge" id="edinfo">Кисть 1 кл.</span>
    <button id="edclose" class="closebtn">Закрыть</button>
  </div>
  <div class="bldr-bar" id="edtools">
    <button data-et="brush" class="on">Кисть</button>
    <button data-et="fill">Заливка</button>
    <button data-et="line">Линия</button>
    <button data-et="rect">Блок</button>
    <button data-et="box">Рамка</button>
    <button data-et="erase">Ластик</button>
    <button id="edUranBtn" class="uran-btn">Уран-235</button>
    <div class="sep"></div>
    <button id="edundo">Отмена</button>
    <button id="edmirror">Повернуть</button>
    <button id="edsym">Симметрия: Выкл</button>
    <button id="edclear">Очистить</button>
  </div>
  <div class="bldr-bar">
    <span style="font-size:11px;color:var(--dim)">Длина: <b id="edwv" style="color:var(--acc2)">12</b></span>
    <input type="range" id="edw" min="5" max="32" value="12" style="width:85px">
    <span style="font-size:11px;color:var(--dim)">Ширина: <b id="edhv" style="color:var(--acc2)">5</b></span>
    <input type="range" id="edh" min="3" max="18" value="5" style="width:85px">
    <span style="font-size:11px;color:var(--dim)">Кисть: <b id="edszv" style="color:var(--acc2)">1</b></span>
    <input type="range" id="edsz" min="1" max="5" value="1" style="width:65px">
  </div>
  <div class="ed-canvas-wrap"><canvas id="edc"></canvas></div>
  <div id="edpal" class="pal-wrap"></div>
  <div class="row" style="margin-top:6px">
    <button id="edfire">Сохранить и выбрать снаряд</button>
  </div>
</div>

<!-- Редактор построек -->
<div id="bldr" class="modal">
  <div class="edhead">
    РЕДАКТОР ПОСТРОЕК
    <span class="statbadge" id="bldinfo">Кисть 3x3 кл. · Бетон</span>
    <button id="bldclose" class="closebtn">Закрыть</button>
  </div>

  <div class="bldr-bar" id="bldtools">
    <button data-bt="brush" class="on">Кисть</button>
    <button data-bt="plate">Плита</button>
    <button data-bt="fill">Заливка</button>
    <button data-bt="line">Линия</button>
    <button data-bt="rect">Блок</button>
    <button data-bt="box">Коробка</button>
    <button data-bt="circle">Круг</button>
    <button data-bt="mannequin" class="bio-btn">Манекен</button>
    <button data-bt="erase">Ластик</button>
    <button id="bldUranBtn" class="uran-btn">Уран-235</button>
    <div class="sep"></div>
    <button id="bldshape">Квадрат</button>
    <button id="bldundo">Отмена</button>
    <button id="bldredo">Повтор</button>
    <button id="bldmirror">Зеркало</button>
    <button id="bldclear">Очистить</button>
  </div>

  <div class="bldr-bar">
    <span style="font-size:11px;color:var(--dim)">Ширина поля: <b id="bldwv" style="color:var(--acc2)">110</b></span>
    <input type="range" id="bldw" min="40" max="160" step="10" value="110" style="width:80px">
    <span style="font-size:11px;color:var(--dim)">Высота: <b id="bldhv" style="color:var(--acc2)">72</b></span>
    <input type="range" id="bldh" min="36" max="110" step="6" value="72" style="width:80px">
    <span style="font-size:11px;color:var(--dim)">Кисть: <b id="bldszv" style="color:var(--acc2)">2</b></span>
    <input type="range" id="bldsz" min="1" max="15" value="2" style="width:85px">
    <div class="sep"></div>
    <button data-tpl="house">Дом</button>
    <button data-tpl="five">5-этажка</button>
    <button data-tpl="tank">Танк</button>
    <button data-tpl="plane">Самолёт</button>
  </div>

  <div class="ed-canvas-wrap"><canvas id="bldc"></canvas></div>
  <div id="bldpal" class="pal-wrap"></div>

  <div class="bldr-bar" style="margin-top:6px">
    <input type="text" id="bldname" placeholder="Название постройки" style="width:150px">
    <button id="bldexport">Скопировать код</button>
    <button id="bldimport">Вставить код</button>
    <button id="bldfiledl">Скачать файл</button>
    <button id="bldfileul">Загрузить файл</button>
    <input type="file" id="bldfileinp" accept=".json,.txt" style="display:none">
  </div>
  <div class="row" style="margin-top:5px">
    <button id="bldstamp">Взять как штамп на карту</button>
    <button id="bldsave" style="border-color:var(--acc);color:#fff">Поставить на сцену и сохранить</button>
  </div>
</div>

<div id="hud"></div>
<div id="fps"></div>

<script>
(()=>{
'use strict';

const WW=960, WH=540, SP=3, PRAD=SP*0.78, RC=2.62, RC2=RC*RC;

 {n:'Бронесталь',    c:[102,112,134], d:8.8, k:.99, brk:2.58,yld:.034,pl:.48,melt:2.45,mu:.28,bh:.04},

 {n:'Карбид кремния',c:[44,62,66],    d:3.2, k:1.05,brk:1.07,yld:9,   pl:0,  melt:2.6, mu:.50,bh:.05},

function newP(x,y,mat){

  px[i]=qx[i]=ox0[i]=x;py[i]=qy[i]=oy0[i]=y;vx[i]=vy[i]=0;im[i]=1/MAT[mat].d;
  isPinned[i]=0;suppVis[i]=0;wasSupp[i]=0;floorT[i]=0;
  pm[i]=mat;flg[i]=ALIVE;if(mat===M.WATER||mat===M.BLOOD)flg[i]|=LIQ;
  awake[i]=0;deg[i]=0;T[i]=0;pres[i]=prD[i]=str[i]=strD[i]=0;
  shade[i]=(Math.random()*256)|0;home[i]=-1;fuse[i]=0;
  const b=i*SL;for(let s=0;s<SL;s++)pb[b+s]=-1;
  return i;
}
function link(a,b){
  const ba=a*SL,bb=b*SL;let sa=-1,sb=-1;
  for(let s=0;s<SL;s++){
    const k0=pb[ba+s];
    if(k0>=0&&(bA[k0]===b||bB[k0]===b))return;
    if(sa<0&&k0<0)sa=s;
    if(sb<0&&pb[bb+s]<0)sb=s;
  }
  if(sa<0||sb<0)return;
  let k;if(freeBTop>0)k=freeB[--freeBTop];else{if(nB>=MAXB)return;k=nB++;}
  const ma=MAT[pm[a]],mb=MAT[pm[b]];
  const d=Math.hypot(px[b]-px[a],py[b]-py[a]);
  bA[k]=a;bB[k]=b;bL0[k]=bRest[k]=d;
  const diag=d>SP*1.8?0.58:(d>SP*1.2?0.85:1.0);
  bK[k]=(ma.k+mb.k)*.5*diag;
  const grain=0.92+((shade[a]^shade[b])&31)*(0.16/31);
  let brkVal=Math.min(ma.brk,mb.brk);
  if(isBio(pm[a])&&isBio(pm[b]))brkVal=Math.max(brkVal,1.55);
  bBrk[k]=1+(brkVal-1)*grain;
  bYld[k]=Math.min(ma.yld,mb.yld);
  bPl[k]=(ma.pl+mb.pl)*.5;
  bMelt[k]=Math.min(ma.melt,mb.melt);
  bAlive[k]=1;bAct[k]=0;
  pb[ba+sa]=k;pb[bb+sb]=k;deg[a]++;deg[b]++;
}
function breakBond(k,fx){
  if(!bAlive[k])return;
  bAlive[k]=0;
  const a=bA[k],b=bB[k];
  let base=a*SL;for(let s=0;s<SL;s++)if(pb[base+s]===k){pb[base+s]=-1;break;}
  base=b*SL;for(let s=0;s<SL;s++)if(pb[base+s]===k){pb[base+s]=-1;break;}
  if(deg[a]>0)deg[a]--;
  if(deg[b]>0)deg[b]--;
  // Опора снимается только когда блок полностью оторван (deg === 0), чтобы постройки не падали целиком
  if(deg[a]===0){isPinned[a]=0;if(home[a]>=0){const ha=home[a];if(occ[ha]===a)occ[ha]=-1;home[a]=-1;}}
  if(deg[b]===0){isPinned[b]=0;if(home[b]>=0){const hb=home[b];if(occ[hb]===b)occ[hb]=-1;home[b]=-1;}}
  freeB[freeBTop++]=k;
  supportDirty=true;
  if(fx){
    brkF++;
    const ma=pm[a],mb=pm[b];
    const bio=isBio(ma)||isBio(mb);
    if(!bio){
      const h=MAT[ma].bh;
      T[a]=Math.min(1.75,T[a]+h);T[b]=Math.min(1.75,T[b]+h);
    }
    wake(a);wake(b);
    if(sparkN<MAXS*.85){
      const mx=(px[a]+px[b])*.5,my=(py[a]+py[b])*.5;
      if(bio){
        if(Math.random()<0.45)
          spark(mx,my,(vx[a]+vx[b])*.4+(Math.random()-.5)*4.0,(vy[a]+vy[b])*.4+(Math.random()-.5)*4.0-0.7,26+Math.random()*30,1.2+Math.random()*0.9,1);
      }else if(Math.random()<.16&&(T[a]>0.28||T[b]>0.28)){
        spark(mx,my,(vx[a]+vx[b])*.5+(Math.random()-.5)*2.6,(vy[a]+vy[b])*.5+(Math.random()-.5)*2.6,18+Math.random()*26,1.0+Math.random()*0.9,0);
      }
    }
  }
}
function kill(i){
  if(!(flg[i]&ALIVE))return;
  const base=i*SL;
  for(let s=0;s<SL;s++){const k=pb[base+s];if(k>=0)breakBond(k,false);}
  flg[i]=0;pm[i]=0;awake[i]=0;T[i]=0;fuse[i]=0;isPinned[i]=0;suppVis[i]=0;wasSupp[i]=0;floorT[i]=0;
  const h=home[i];if(h>=0&&occ[h]===i)occ[h]=-1;home[i]=-1;
  freeP[freePTop++]=i;
  supportDirty=true;
}
function wake(i){
  if(awake[i]===0){
    act[actCount++]=i;
    const base=i*SL;
    for(let s=0;s<SL;s++){const k=pb[base+s];if(k>=0&&!bAct[k]){bAct[k]=1;actB[actBCount++]=k;}}
  }
  awake[i]=SLEEPF;
}

function putCell(cx,cy,mat,pin){
  if(cx<0||cy<0||cx>=LX||cy>=LY||!mat)return -1;
  const c=cy*LX+cx,x=cx*SP+1.5,y=cy*SP+1.5;
  const o=occ[c];
  if(o>=0&&(flg[o]&ALIVE)&&home[o]===c&&Math.abs(px[o]-x)<2.4&&Math.abs(py[o]-y)<2.4){
    if(pm[o]===mat)return o;
    kill(o);
  }
  const i=newP(x,y,mat);if(i<0)return -1;
  ox0[i]=x;oy0[i]=y;
  // Надёжная фиксация фундамента у земли (нижние 4 ряда клеток)
  if(pin||(pin===undefined&&cy>=LY-4&&!isBio(mat)))isPinned[i]=1;
  suppVis[i]=isPinned[i]?1:0;
  home[i]=c;occ[c]=i;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const d2=dx*dx+dy*dy;
    if(d2===0||d2>5)continue;
    const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=LX||ny>=LY)continue;
    const j=occ[ny*LX+nx];
    if(j>=0&&(flg[j]&ALIVE)&&home[j]===ny*LX+nx&&!(flg[j]&PROJ)){
      if(Math.hypot(px[j]-x,py[j]-y)<SP*2.45)link(i,j);
    }
  }
  supportDirty=true;
  return i;
}

function rectC(x0,y0,w,h,mat,pinEdges){
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const p=pinEdges&&(y<3||y>=h-3);
    putCell(x0+x,y0+y,mat,p);
  }
}
function rotRect(cx,cy,len,thick,ang,mat,pinEnds){
  const c=Math.cos(ang),s=Math.sin(ang),R=Math.ceil(Math.hypot(len,thick)/2)+1;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const u=dx*c+dy*s,v=-dx*s+dy*c;
    if(Math.abs(u)<=len/2&&Math.abs(v)<=thick/2){
      const p=pinEnds&&Math.abs(u)>=len/2-4;
      putCell(cx+dx,cy+dy,mat,p);
    }
  }
}
function boxShell(x0,y0,w,h,shell,core,t,pinBot){
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const edge=x<t||y<t||x>=w-t||y>=h-t;
    putCell(x0+x,y0+y,edge?shell:core,pinBot&&y>=h-3);
  }
}

/* ================= ГЕНЕРАТОРЫ: МАНЕКЕН, УВЕЛИЧЕННЫЙ ТАНК, САМОЛЁТ, БОЛЬШОЙ ДОМ, ПЯТИЭТАЖКА ================= */
function drawMannequin(put,ox,oy){
  // Череп + Мозг + Лицо (dy = -27.. -21)
  for(let dy=-27;dy<=-21;dy++){
    for(let dx=-3;dx<=3;dx++){
      if((dy===-27||dy===-21)&&Math.abs(dx)===3)continue;
      let m=M.FLESH;
      if(dy===-27||dy===-26&&Math.abs(dx)===3||dy===-25&&Math.abs(dx)===3||dy===-22&&Math.abs(dx)<=2)m=M.BONE;
      else if(dy>=-26&&dy<=-24&&dx>=-2&&dx<=1)m=M.BRAIN;
      else if(dy===-24&&dx===2)m=M.BONE;
      put(ox+dx,oy+dy,m,false);
    }
  }
  for(let dy=-20;dy<=-19;dy++){
    put(ox-1,oy+dy,M.FLESH,false);
    put(ox,oy+dy,M.BONE,false);
    put(ox+1,oy+dy,M.BLOOD,false);
  }
  for(let dy=-18;dy<=-12;dy++){
    for(let dx=-3;dx<=3;dx++){
      let m=M.FLESH;
      if(dy===-18&&Math.abs(dx)<=3)m=M.BONE;
      else if(dx===0)m=M.BONE;
      else if(dx>=1&&dx<=2&&dy>=-16&&dy<=-14)m=M.HEART;
      else if(dx===-1&&dy>=-16&&dy<=-14)m=M.BLOOD;
      else if(Math.abs(dx)>=2&&(dy%2===0))m=M.BONE;
      put(ox+dx,oy+dy,m,false);
    }
  }
  for(let dy=-18;dy<=-9;dy++){
    put(ox-5,oy+dy,M.FLESH,false);
    put(ox-4,oy+dy,dy<=-11?M.BONE:M.FLESH,false);
    put(ox+4,oy+dy,dy<=-11?M.BONE:M.FLESH,false);
    put(ox+5,oy+dy,M.FLESH,false);
  }
  for(let dy=-11;dy<=-8;dy++){
    for(let dx=-3;dx<=3;dx++){
      let m=M.FLESH;
      if(dx===0&&dy===-11)m=M.BONE;
      else if(Math.abs(dx)<=2)m=M.GUTS;
      put(ox+dx,oy+dy,m,false);
    }
  }
  for(let dy=-7;dy<=-6;dy++){
    for(let dx=-3;dx<=3;dx++){
      const m=(dy===-7||Math.abs(dx)>=2||dx===0)?M.BONE:M.FLESH;
      put(ox+dx,oy+dy,m,false);
    }
  }
  for(let dy=-5;dy<=0;dy++){
    put(ox-3,oy+dy,M.FLESH,false);
    put(ox-2,oy+dy,M.BONE,false);
    put(ox-1,oy+dy,dy===0?M.BONE:M.FLESH,false);
    put(ox+1,oy+dy,M.FLESH,false);
    put(ox+2,oy+dy,M.BONE,false);
    put(ox+3,oy+dy,dy===0?M.BONE:M.FLESH,false);
  }
}

function spawnMannequinWorld(cx,cy){
  const ids=[];
  drawMannequin((x,y,m)=>{
    const i=putCell(x,y,m,false);
    if(i>=0)ids.push(i);
  },cx,cy);
  const R2=(SP*2.45)*(SP*2.45);
  for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){
    const i=ids[a],j=ids[b],dx=px[i]-px[j],dy=py[i]-py[j];
    if(dx*dx+dy*dy<=R2)link(i,j);
  }
  for(const i of ids)wake(i);
  return ids;
}

function drawCrewMannequin(put,ox,oy){
  for(let dy=-17;dy<=-12;dy++)for(let dx=-2;dx<=2;dx++){
    let m=M.BONE;
    if(dy>=-16&&dy<=-14&&Math.abs(dx)<=1)m=M.BRAIN;
    else if(dy===-13&&dx>=0)m=M.FLESH;
    put(ox+dx,oy+dy,m,false);
  }
  put(ox,oy-11,M.BONE,false);put(ox+1,oy-11,M.BLOOD,false);
  for(let dy=-10;dy<=-4;dy++)for(let dx=-2;dx<=2;dx++){
    let m=M.FLESH;
    if(dx===0)m=M.BONE;
    else if(dx===1&&dy>=-9&&dy<=-7)m=M.HEART;
    else if(Math.abs(dx)<=1&&dy>=-5)m=M.GUTS;
    else if(Math.abs(dx)===2&&(dy%2===0))m=M.BONE;
    put(ox+dx,oy+dy,m,false);
  }
  for(let dy=-3;dy<=0;dy++){
    put(ox-1,oy+dy,M.BONE,false);put(ox-2,oy+dy,M.FLESH,false);
    put(ox+1,oy+dy,M.BONE,false);put(ox+2,oy+dy,M.FLESH,false);
  }
}

// 1. УВЕЛИЧЕННЫЙ ТАНК (ОБТ повышенного масштаба: dx = -60..+78, высота 48 клеток)
function drawTank(put,ox,oy){
  // Гусеницы и 7 больших опорных катков (dy = -12..0, dx = -58..58)
  for(let dx=-58;dx<=58;dx++){
    put(ox+dx,oy,M.RUB,false);
    put(ox+dx,oy-1,M.STEEL,false);
    put(ox+dx,oy-11,M.STEEL,false);
    put(ox+dx,oy-12,M.HHA,false);
  }
  for(let dy=-12;dy<=0;dy++){
    const off=Math.max(0,Math.abs(dy+6)-3);
    put(ox-60+off,oy+dy,M.STEEL,false);put(ox-59+off,oy+dy,M.RUB,false);
    put(ox+60-off,oy+dy,M.STEEL,false);put(ox+59-off,oy+dy,M.RUB,false);
  }
  for(let w=-48;w<=48;w+=16){
    for(let dy=-10;dy<=-2;dy++)for(let dx=-4;dx<=4;dx++){
      const d2=dx*dx+(dy+6)*(dy+6);
      if(d2<=16)put(ox+w+dx,oy+dy,d2<=3?M.TI:(d2<=10?M.STEEL:M.RUB),false);
    }
  }
  // Бронеднище и корпус (dy = -27..-13)
  for(let dx=-58;dx<=52;dx++){
    put(ox+dx,oy-13,M.HHA,false);
    put(ox+dx,oy-14,M.HHA,false);
  }
  // Корма, МТО (двигатель + топливные баки, dx = -58..-22)
  for(let dy=-27;dy<=-15;dy++){
    put(ox-58,oy+dy,M.HHA,false);put(ox-57,oy+dy,M.HHA,false);put(ox-56,oy+dy,M.STEEL,false);
    put(ox-22,oy+dy,M.STEEL,false);put(ox-21,oy+dy,M.STEEL,false);
  }
  for(let dx=-58;dx<=-21;dx++){
    put(ox+dx,oy-27,M.HHA,false);put(ox+dx,oy-26,M.STEEL,false);
  }
  for(let dy=-24;dy<=-15;dy++)for(let dx=-54;dx<=-42;dx++)put(ox+dx,oy+dy,M.FUEL,false);
  for(let dy=-24;dy<=-15;dy++)for(let dx=-40;dx<=-24;dx++)put(ox+dx,oy+dy,(dx+dy)%2===0?M.STEEL:M.ALU,false);

  // Лобовая многослойная композитная броня ВЛД/НЛД + ДЗ (dx = 34..60, dy = -27..-13)
  for(let dy=-27;dy<=-13;dy++){
    const s=((dy+27)*1.15)|0;
    for(let t=0;t<12;t++){
      const m=t<3?M.HHA:(t<8?M.CER:(t<10?M.ALU:M.HHA));
      put(ox+34+s+t,oy+dy,m,false);
    }
    put(ox+46+s,oy+dy,M.EXP,false);
    put(ox+47+s,oy+dy,M.HHA,false);
  }
  // Крыша корпуса
  for(let dx=-21;dx<=36;dx++){put(ox+dx,oy-27,M.HHA,false);put(ox+dx,oy-26,M.STEEL,false);}

  // Карусель боеукладки на дне боевого отделения
  for(let dx=-16;dx<=10;dx+=5){
    for(let dy=-19;dy<=-15;dy++)for(let sx=0;sx<4;sx++){
      const edge=sx===0||sx===3||dy===-19||dy===-15;
      put(ox+dx+sx,oy+dy,edge?M.BRASS:M.CMPB,false);
    }
  }

  // Крупная башня (dy = -44..-28, dx = -26..30)
  for(let dy=-44;dy<=-28;dy++){
    const frontSlope=((44+dy)*0.95)|0;
    put(ox-26,oy+dy,M.HHA,false);put(ox-25,oy+dy,M.HHA,false);put(ox-24,oy+dy,M.STEEL,false);
    if(dy>=-41&&dy<=-30){
      for(let dx=-23;dx<=-14;dx++)put(ox+dx,oy+dy,dx===-23||dy===-41||dy===-30?M.BRASS:M.CMPB,false);
      put(ox-13,oy+dy,M.HHA,false);
    }
    const fx=18+frontSlope;
    for(let t=0;t<11;t++){
      const m=t<3?M.HHA:(t<7?M.CER:(t<9?M.W:M.HHA));
      put(ox+fx+t,oy+dy,m,false);
    }
    put(ox+fx+11,oy+dy,M.EXP,false);
    put(ox+fx+12,oy+dy,M.HHA,false);
  }
  // Крыша башни
  for(let dx=-26;dx<=22;dx++){
    put(ox+dx,oy-44,M.HHA,false);put(ox+dx,oy-43,M.HHA,false);put(ox+dx,oy-42,M.STEEL,false);
  }
  // Длинная 125-мм пушка (dx = 28..76, dy = -37..-34)
  for(let dx=28;dx<=76;dx++){
    put(ox+dx,oy-37,M.HHA,false);
    put(ox+dx,oy-36,dx===76?M.HHA:M.EMPTY,false);
    put(ox+dx,oy-35,dx===76?M.HHA:M.EMPTY,false);
    put(ox+dx,oy-34,M.HHA,false);
    if(dx>=44&&dx<=54){put(ox+dx,oy-38,M.STEEL,false);put(ox+dx,oy-33,M.STEEL,false);}
  }
  // Экипаж внутри просторных отделений
  drawCrewMannequin(put,ox-3,oy-21);
  drawCrewMannequin(put,ox+24,oy-15);
}

// 2. САМОЛЁТ
function drawPlane(put,ox,oy){
  for(let dy=-9;dy<=-3;dy++){
    put(ox+28,oy+dy,M.TI,false);put(ox+29,oy+dy,M.TI,false);
    put(ox-8,oy+dy,M.TI,false);put(ox-7,oy+dy,M.TI,false);put(ox-6,oy+dy,M.TI,false);
  }
  for(let dy=-3;dy<=0;dy++)for(let dx=-2;dx<=2;dx++){
    put(ox+28+dx,oy+dy,Math.abs(dx)<=1&&dy===-1?M.STEEL:M.RUB,false);
    put(ox-7+dx,oy+dy,Math.abs(dx)<=1&&dy===-1?M.STEEL:M.RUB,false);
  }
  put(ox+4,oy-9,M.STEEL,false);put(ox+5,oy-9,M.STEEL,false);
  for(let dy=-8;dy<=-5;dy++)for(let dx=-2;dx<=12;dx++){
    const edge=dx===-2||dx>=10||dy===-8||dy===-5;
    put(ox+dx,oy+dy,edge?M.STEEL:M.CMPB,false);
  }
  for(let dx=-46;dx<=50;dx++){
    let top=-24,bot=-10;
    if(dx>30){top=-24+((dx-30)*0.45)|0;bot=-10-((dx-30)*0.15)|0;}
    if(dx<-30){bot=-10-((-30-dx)*0.12)|0;}
    for(let dy=top;dy<=bot;dy++){
      const skin=(dy===top||dy===bot||dx===-46||dx>=48);
      if(dx>=14&&dx<=30&&dy<=-19){
        if(dy===top||dy===top+1||dx===14||dx===30)put(ox+dx,oy+dy,M.GLASS,false);
        continue;
      }
      if(skin){
        put(ox+dx,oy+dy,dx>=12&&dx<=32?M.TI:M.ALU,false);
      }else if(dx>=13&&dx<=31&&(dy===bot-1||dx===13||dx===31)){
        put(ox+dx,oy+dy,M.TI,false);
      }else if(dx>32&&dx<47){
        if(dy===-15||dy===-14)put(ox+dx,oy+dy,M.CU,false);
      }else if(dx>=-16&&dx<=11&&dy>top+1&&dy<bot-1){
        if(dx===-2||dx===-1||dy===-16)put(ox+dx,oy+dy,M.TI,false);
        else put(ox+dx,oy+dy,M.FUEL,false);
      }else if(dx>=-44&&dx<=-18&&dy>top+1&&dy<bot-1){
        const m=(dx%3===0)?M.TI:((dy===-16||dy===-15)?M.STEEL:M.FUEL);
        put(ox+dx,oy+dy,m,false);
      }
    }
  }
  for(let dx=36;dx<=56;dx++)put(ox+dx,oy-11,M.HHA,false);
  for(let dy=-38;dy<=-24;dy++){
    const xStart=-46+((-24-dy)*0.55)|0;
    const xEnd=-32+((-24-dy)*0.15)|0;
    for(let dx=xStart;dx<=xEnd;dx++){
      put(ox+dx,oy+dy,(dx===xStart||dx===xEnd||dy===-38)?M.TI:M.ALU,false);
    }
  }
  drawCrewMannequin(put,ox+22,oy-12);
}

// 3. УВЕЛИЧЕННЫЙ ДВУХЭТАЖНЫЙ ДОМ (высота этажа 34 кл., чтобы манекены 28 кл. стояли свободно и не задевали потолок головой!)
function drawHouse(put,ox,oy){
  const W=46, FH=34;
  // Бетонный фундамент (dy = -3..0)
  for(let dy=-3;dy<=0;dy++)for(let dx=-W;dx<=W;dx++)put(ox+dx,oy+dy,M.CONC,true);
  for(let fl=0;fl<2;fl++){
    const yBot=-4-fl*FH, yTop=yBot-(FH-3);
    for(let dy=yTop;dy<=yBot;dy++){
      const isWin=(dy<=yBot-7&&dy>=yTop+6);
      for(let t=0;t<4;t++){
        put(ox-W+t,oy+dy,isWin&&(t===1||t===2)?M.GLASS:M.BRICK,fl===0&&dy>=-5);
        put(ox+W-t,oy+dy,isWin&&(t===1||t===2)?M.GLASS:M.BRICK,fl===0&&dy>=-5);
      }
      // Центральная несущая стена с высоким дверным проёмом
      if(dy<yBot-16||dy>yBot-1){
        put(ox-1,oy+dy,M.BRICK,false);put(ox,oy+dy,M.BRICK,false);put(ox+1,oy+dy,M.BRICK,false);
      }
      if(isWin){
        for(let dx=-30;dx<=-20;dx++)put(ox+dx,oy+dy,M.GLASS,false);
        for(let dx=20;dx<=30;dx++)put(ox+dx,oy+dy,M.GLASS,false);
      }
    }
    // Перекрытие потолка этажа
    for(let dx=-W-1;dx<=W+1;dx++){
      put(ox+dx,oy+yTop-1,M.CONC,false);
      put(ox+dx,oy+yTop-2,M.OAK,false);
    }
    // Деревянный стол внутри
    const tx=fl===0?-26:24;
    for(let dx=-6;dx<=6;dx++)put(ox+tx+dx,oy+yBot-6,M.OAK,false);
    for(let dy=yBot-5;dy<=yBot;dy++){put(ox+tx-5,oy+dy,M.OAK,false);put(ox+tx+5,oy+dy,M.OAK,false);}
  }
  // Газовый баллон на 1 этаже
  for(let dy=-12;dy<=-4;dy++)for(let dx=32;dx<=36;dx++){
    const edge=dx===32||dx===36||dy===-12||dy===-4;
    put(ox+dx,oy+dy,edge?M.STEEL:M.FUEL,false);
  }
  // Двускатная крыша
  const roofBase=-4-2*FH;
  for(let h=0;h<=20;h++){
    const dy=roofBase-h, span=W+3-Math.floor(h*2.2);
    if(span<0)break;
    for(let dx=-span;dx<=span;dx++){
      if(Math.abs(dx)>=span-2){
        put(ox+dx,oy+dy,M.BRICK,false);
        put(ox+dx,oy+dy+1,M.OAK,false);
      }else if(h%5===0&&Math.abs(dx)%8===0){
        put(ox+dx,oy+dy,M.OAK,false);
      }
    }
  }
  // Полноростовые манекены на 1 и 2 этажах с запасом над головой
  drawMannequin(put,ox+12,oy-4);
  drawMannequin(put,ox-12,oy-4-FH);
}

// 4. ПЯТИЭТАЖКА
function drawFiveStory(put,ox,oy){
  const W=44, FH=25;
  for(let dy=-3;dy<=0;dy++)for(let dx=-W;dx<=W;dx++)put(ox+dx,oy+dy,M.CONC,true);

  for(let f=0;f<5;f++){
    const yBot=-4-f*FH, yTop=yBot-(FH-3);
    for(let dy=yTop;dy<=yBot;dy++){
      const win=(dy<=yBot-5&&dy>=yTop+4);
      for(let t=0;t<4;t++){
        put(ox-W+t,oy+dy,win&&(t===1||t===2)?M.GLASS:M.CONC,f===0&&dy>=-5);
        put(ox+W-t,oy+dy,win&&(t===1||t===2)?M.GLASS:M.CONC,f===0&&dy>=-5);
      }
      for(let t=-1;t<=1;t++){
        const door=(dy>yBot-11&&dy<=yBot);
        put(ox-14+t,oy+dy,door&&t===0?M.OAK:M.CONC,false);
        put(ox+14+t,oy+dy,door&&t===0?M.OAK:M.CONC,false);
      }
      if(win){

function getScaledShape(def,scale){
  const sh=def.shape, h0=sh.length, w0=sh[0].length;
  if(Math.abs(scale-1.0)<0.05)return sh;
  const h=Math.max(1,Math.round(h0*scale)), w=Math.max(2,Math.round(w0*scale));
  const out=[];
  for(let r=0;r<h;r++){
    let row='';
    const sr=Math.min(h0-1,Math.floor(r/h*h0));
    for(let c=0;c<w;c++){
      const sc_=Math.min(w0-1,Math.floor(c/w*w0));
      row+=sh[sr][sc_];
    }
    out.push(row);
  }
  return out;
}

function spawnProj(def,nx,ny,ang,mps){
  const sh=getScaledShape(def,projScale);
  const h=sh.length,w=sh[0].length,ca=Math.cos(ang),sa=Math.sin(ang);
  const ids=[],sp=mps/SPD_K;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const ch=sh[r][c];if(ch==='.')continue;
    const u=(c-(w-1))*SP,v=(r-(h-1)/2)*SP;
    const x=nx+u*ca-v*sa,y=ny+u*sa+v*ca;
    const i=newP(x,y,PCH[ch]||M.STEEL);if(i<0)continue;
    flg[i]|=PROJ;vx[i]=ca*sp;vy[i]=sa*sp;
    ids.push(i);
  }
  // Усиленная перекрёстная связка снаряда (SP*3.1), чтобы снаряд держал жёсткую баллистическую форму в полёте и при пробитии
  const R2=(SP*3.15)*(SP*3.15);
  for(let a=0;a<ids.length;a++)for(let b=a+1;b<ids.length;b++){
    const i=ids[a],j=ids[b],dx=px[i]-px[j],dy=py[i]-py[j];
    if(dx*dx+dy*dy<=R2)link(i,j);
  }
  for(const i of ids)wake(i);
  const p={def,type:def.type,ids,v0:sp,dx:ca,dy:sa,armed:-1,sp:mps};
  projs.push(p);
  lastShotSpeed=mps;shotFrames=0;peakT=0;
  startFlightRecord();
  recordFlightStep();
  return p;
}

function updateProjectiles(){
  for(let pi=projs.length-1;pi>=0;pi--){
    const p=projs[pi], ids=p.ids;let w=0;
    let avx=0,avy=0;
    for(let k=0;k<ids.length;k++){
      const i=ids[k];
      if((flg[i]&ALIVE)&&(flg[i]&PROJ)){
        ids[w++]=i;avx+=vx[i];avy+=vy[i];
      }
    }
    ids.length=w;
    if(!w){projs.splice(pi,1);continue;}
    avx/=w;avy/=w;
    const sp=Math.hypot(avx,avy);
    // Стабилизация полёта снаряда (выравнивание скоростей частиц внутри целого снаряда и плавное обновление вектора курса)
    if(sp>1.5){
      p.dx=avx/sp;p.dy=avy/sp;
      for(let k=0;k<w;k++){
        const i=ids[k];
        if(deg[i]>=2){
          vx[i]=vx[i]*0.92+avx*0.08;
          vy[i]=vy[i]*0.92+avy*0.08;
        }
      }
    }
    if(p.type==='he'){
      if(p.armed<0&&sp<p.v0*.72)p.armed=2;
      if(p.armed>=0&&--p.armed<=0){
        for(const i of p.ids)if(isEX(pm[i]))igniteE(i,1+((Math.random()*3)|0));
        projs.splice(pi,1);
      }
    }else if(p.type==='heat'){
      let best=-1e9,nxp=0,nyp=0;
      for(const i of p.ids){const pr=px[i]*p.dx+py[i]*p.dy;if(pr>best){best=pr;nxp=px[i];nyp=py[i];}}
      let hit=-1;
      for(let s=3;s<=54;s+=3){
        const x=nxp+p.dx*s,y=nyp+p.dy*s;
        if(x<0||y<0||x>=WW||y>=WH)break;
        const c=((y/SP)|0)*LX+((x/SP)|0),o=occ[c];
        if(o>=0&&(flg[o]&ALIVE)&&!(flg[o]&PROJ)){hit=s;break;}
      }
      if(hit>0&&hit<=40){
        const cu=[];
        for(const i of p.ids)if(pm[i]===M.CU)cu.push(i);
        for(const i of cu)kill(i);
        for(const i of p.ids)if(isEX(pm[i]))igniteE(i,1+((Math.random()*3)|0));
        spawnJet(nxp,nyp,p.dx,p.dy);
        projs.splice(pi,1);
      }
    }
  }
}

/* ================= ПЛАВНЫЕ ВЗРЫВЫ И ДЕТОНАЦИЯ УРАНА ================= */
const EXP_IMP=2.55, EXP_R=16.5, BLAST_R=34, CHAIN_R=11.0;
const MAX_DET_PER_FRAME=14; // Ограничение детонаций за кадр для плавной волны взрыва и отсутствия лагов

function igniteE(i,d){
  if(fuse[i]!==0||!isEX(pm[i])||!(flg[i]&ALIVE))return;
  fuse[i]=Math.max(1,d|0);
  pendA[pendCount++]=i;
}
function detonate(i){
  const x=px[i],y=py[i],mat=pm[i];
  const isFuel=(mat===M.FUEL);
  const isUran=(mat===M.URAN);
  const pwr=isUran?2.65:(mat===M.C4?1.38:(mat===M.CMPB?1.22:(isFuel?0.85:1.0)));
  detCount++;detF++;
  addBlastFx(x,y,pwr*0.62,isUran);

  const R=BLAST_R*pwr;
  const chainR=isUran?CHAIN_R*1.6:CHAIN_R;
  const cx0=Math.max(0,((x-R)/CELL)|0),cx1=Math.min(GX-1,((x+R)/CELL)|0);
  const cy0=Math.max(0,((y-R)/CELL)|0),cy1=Math.min(GY-1,((y+R)/CELL)|0);
  for(let pass=0;pass<2;pass++){
    const St=pass?sStart:dStart,It=pass?sItems:dItems;
    for(let cy=cy0;cy<=cy1;cy++){
      const row=cy*GX;
      for(let s=St[row+cx0],e=St[row+cx1+1];s<e;s++){
        const j=It[s];
        if(j===i||!(flg[j]&ALIVE))continue;
        if(pass&&awake[j]>0)continue;
        const dx=px[j]-x,dy=py[j]-y,d2=dx*dx+dy*dy;
        if(d2>R*R)continue;
        const d=Math.sqrt(d2)||.001,mj=pm[j];
        // Плавная цепная реакция с задержкой, пропорциональной расстоянию
        if(isEX(mj)&&d<chainR){
          const delay=Math.max(2,Math.round(d*0.55)+((Math.random()*3)|0));
          igniteE(j,delay);
        }
        if(d<EXP_R*pwr){
          const f=1-d/(EXP_R*pwr);
          const dv=EXP_IMP*pwr*f*f/Math.pow(1/im[j],.55);
          vx[j]+=dx/d*dv;vy[j]+=dy/d*dv;
          if(!isBio(mj))T[j]=Math.min(1.8,T[j]+(isUran?0.65:0.30)*f);
          if(f>0.46&&(mj===M.GLASS||mj===M.BRICK||mj===M.CONC||mj===M.OAK||isBio(mj)||(isUran&&f>0.55))){
            const base=j*SL;
            for(let sl_i=0;sl_i<SL;sl_i++){
              const bk=pb[base+sl_i];
              if(bk>=0&&Math.random()<(isUran?0.82:0.58))breakBond(bk,true);
            }
          }
          wake(j);
        }else{
          const f=1-d/R;
          if(mj===M.GLASS&&f>0.28){
            const base=j*SL;
            for(let sl_i=0;sl_i<SL;sl_i++){const bk=pb[base+sl_i];if(bk>=0)breakBond(bk,false);}
          }
          const dv=0.48*pwr*f*f*im[j];
          vx[j]+=dx/d*dv;vy[j]+=dy/d*dv;
          if(f>0.42||isBio(mj)||deg[j]<3)wake(j);
        }
      }
    }
  }
  puff(x,y,0,0,1.35*pwr);
  const ang=Math.random()*6.283,sp=.6+Math.random()*2.4;
  gas(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp,22+Math.random()*22,3.4+Math.random()*3.2,0);
  if(sparkN<MAXS*.82){
    const ns=isUran?5:2;
    for(let k=0;k<ns;k++){
      const a2=Math.random()*6.283,s2=(2.2+Math.random()*7.5)*(isUran?1.4:1);
      spark(x,y,Math.cos(a2)*s2,Math.sin(a2)*s2-0.8,24+Math.random()*32,1.2+Math.random()*0.8,k===0?2:0);
    }
  }
  kill(i);
}

function processDet(){
  const n=pendCount;if(!n)return;
  const cur=pendA;pendA=pendB;pendB=cur;pendCount=0;
  let detThisFrame=0;
  for(let idx=0;idx<n;idx++){
    const i=cur[idx];
    if(!(flg[i]&ALIVE)||!isEX(pm[i])){fuse[i]=0;continue;}
    if(fuse[i]<=1&&detThisFrame<MAX_DET_PER_FRAME){
      detThisFrame++;
      detonate(i);
    }else{
      if(fuse[i]>1)fuse[i]--;
      pendA[pendCount++]=i;
    }
  }
}

/* ================= АНАЛИЗ ОПОР ЗДАНИЙ (ЧТОБЫ ПОСТРОЙКА ДЕРЖАЛАСЬ И НЕ ПАДАЛА ЦЕЛИКОМ) ================= */
function updateSupport(wakeDetached){
  supportDirty=false;
  let head=0,tail=0;
  for(let i=0;i<nP;i++){
    wasSupp[i]=suppVis[i];
    suppVis[i]=0;
    if(!(flg[i]&ALIVE))continue;
    // Любой закреплённый блок ИЛИ строительный блок у самой земли с связями является точкой опоры
    if(isPinned[i]||(!(flg[i]&PROJ)&&!isBio(pm[i])&&deg[i]>=2&&py[i]>=WH-SP*3.5)){
      suppVis[i]=1;
      suppQ[tail++]=i;
    }
  }
  while(head<tail){
    const u=suppQ[head++];
    const base=u*SL;
    for(let s=0;s<SL;s++){
      const k=pb[base+s];
      if(k<0||!bAlive[k])continue;
      const v=bA[k]===u?bB[k]:bA[k];
      if(!suppVis[v]&&(flg[v]&ALIVE)){
        suppVis[v]=1;
        suppQ[tail++]=v;
      }
    }
  }
  if(wakeDetached){
    for(let i=0;i<nP;i++){
      if((flg[i]&ALIVE)&&wasSupp[i]&&!suppVis[i]){
        wake(i);
      }
    }
  }
}

/* ================= ПРОСТРАНСТВЕННЫЙ ХЭШ И ОПТИМИЗИРОВАННАЯ ФИЗИКА ================= */
const hashTmp=new Int32Array(MAXP);
function hashBuild(list,n,Start,Fill,Items,Cell,useQ,onlySleep){
  Start.fill(0);let m=0;
  for(let k=0;k<n;k++){
    const i=list?list[k]:k;
    if(!(flg[i]&ALIVE))continue;
    if(onlySleep&&awake[i]>0)continue;
    const X=useQ?qx[i]:px[i],Y=useQ?qy[i]:py[i];
    let cx=(X/CELL)|0,cy=(Y/CELL)|0;
    if(cx<0)cx=0;else if(cx>=GX)cx=GX-1;
    if(cy<0)cy=0;else if(cy>=GY)cy=GY-1;
    const c=cy*GX+cx;Cell[m]=c;Items[m]=i;m++;Start[c+1]++;
  }
  for(let c=0;c<NC;c++)Start[c+1]+=Start[c];
  Fill.set(Start);
  for(let k=0;k<m;k++)hashTmp[Fill[Cell[k]]++]=Items[k];
  for(let k=0;k<m;k++)Items[k]=hashTmp[k];
  return m;
}

function solveBonds(dt){
  const heavyLoad=actBCount>2200;
  for(let t=0;t<actBCount;t++){
    const k=actB[t];if(!bAlive[k])continue;
    const a=bA[k],b=bB[k];
    const dx=qx[b]-qx[a],dy=qy[b]-qy[a],d2=dx*dx+dy*dy;
    if(d2<1e-12)continue;
    const L0=bL0[k];
    // Быстрый пропуск почти не деформированных связей при большой нагрузке (убирает лаги при изгибе и падении)
    if(heavyLoad&&Math.abs(d2-bRest[k]*bRest[k])<0.04)continue;
    const d=Math.sqrt(d2);
    const ma=pm[a],mb=pm[b];
    const metal=isMetal(ma)||isMetal(mb);
    const tm=(T[a]+T[b])*.5;

    let soft=1.0,brkMult=1.0,stiffSoft=1.0;
    if(metal){
      if(tm>0.22){soft=0.42;brkMult=1.22;stiffSoft=Math.max(0.4,1-0.5*Math.min(1,tm/bMelt[k]));}
    }else if(tm>0.08){
      soft=Math.max(0.25,1-0.65*Math.min(1,tm/bMelt[k]));
      brkMult=0.55+0.45*soft;stiffSoft=soft;
    }

    const maxL=L0*(1+(bBrk[k]-1)*brkMult);
    if(d>maxL){
      breakBond(k,true);
      continue;
    }

    let rest=bRest[k],c=d-rest;
    const yl=rest*bYld[k]*soft,plRate=metal?0.52:bPl[k];
    if(c>yl){
      const dr=(c-yl)*plRate;rest=Math.min(maxL,rest+dr);bRest[k]=rest;c=d-rest;
      if(!isBio(ma)){const h=dr*0.003;T[a]=Math.min(1.75,T[a]+h);T[b]=Math.min(1.75,T[b]+h);}
    }else if(c<-yl){
      const dr=(c+yl)*plRate;rest=Math.max(L0*0.42,rest+dr);bRest[k]=rest;c=d-rest;
    }

    const wa=isPinned[a]?0:im[a],wb=isPinned[b]?0:im[b],w=wa+wb;
    if(w<1e-9)continue;
    const kk=bK[k]*stiffSoft;
    const dvx=(qx[b]-px[b])-(qx[a]-px[a]),dvy=(qy[b]-py[b])-(qy[a]-py[a]);
    // Усиленное демпфирование при изгибе и падении конструкций (быстро гасит пружинящие колебания)
    const dampRate=(suppVis[a]&&suppVis[b])?0.70:0.58;
    const damp=((dvx*dx+dvy*dy)/d2)*dampRate;
    const f=(c*kk/d+damp)/w;
    const dxa=dx*f*wa,dya=dy*f*wa,dxb=dx*f*wb,dyb=dy*f*wb;
    qx[a]+=dxa;qy[a]+=dya;qx[b]-=dxb;qy[b]-=dyb;

    if(c<0){const pI=-c*kk/w*.5;pres[a]+=pI;pres[b]+=pI;}
    const s=(c<0?-c:c)/rest;if(s>str[a])str[a]=s;if(s>str[b])str[b]=s;
    if(awake[a]===0&&dxa*dxa+dya*dya>0.055)wake(a);
    if(awake[b]===0&&dxb*dxb+dyb*dyb>0.055)wake(b);
  }
}

function pair(a,b,dt,stat){
  // Пропуск самостолкновений внутри одного гнущегося или падающего куска конструкции (радиус 2 клетки)
  if(deg[a]>=2&&deg[b]>=2&&!((flg[a]|flg[b])&PROJ)){
    const odx=ox0[a]-ox0[b],ody=oy0[a]-oy0[b];
    if(odx>=-SP*2.1&&odx<=SP*2.1&&ody>=-SP*2.1&&ody<=SP*2.1)return;
  }
  let dx=qx[b]-qx[a],dy=qy[b]-qy[a];
  const d2=dx*dx+dy*dy;
  if(d2>=RC2)return;
  let d=Math.sqrt(d2);
  if(d<1e-5){dx=Math.random()-.5;dy=Math.random()-.5;d=Math.hypot(dx,dy)||1;}
  const nx=dx/d,ny=dy/d,ov=RC-d;
  let wa=isPinned[a]?0:im[a],wb=isPinned[b]?0:im[b];
  const aFrag=deg[a]===0&&!(flg[a]&PROJ),bFrag=deg[b]===0&&!(flg[b]&PROJ);
  if(aFrag&&deg[b]>=2)wb*=0.06;else if(bFrag&&deg[a]>=2)wa*=0.06;
  const w=wa+wb;if(w<1e-9)return;
  const rvx=(qx[a]-px[a])-(qx[b]-px[b]),rvy=(qy[a]-py[a])-(qy[b]-py[b]);
  const rn=(rvx*nx+rvy*ny)/dt;
  const ca=ov*wa/w,cb=ov*wb/w;
  qx[a]-=nx*ca;qy[a]-=ny*ca;qx[b]+=nx*cb;qy[b]+=ny*cb;

  const tx=rvx-(rvx*nx+rvy*ny)*nx,ty=rvy-(rvx*nx+rvy*ny)*ny,tl=Math.sqrt(tx*tx+ty*ty);
  const mu=(MU[pm[a]]+MU[pm[b]])*.5;
  if(tl>1e-6&&!((flg[a]|flg[b])&LIQ)){
    const f=Math.min(mu*ov,tl)/tl;
    qx[a]-=tx*f*wa/w;qy[a]-=ty*f*wa/w;qx[b]+=tx*f*wb/w;qy[b]+=ty*f*wb/w;
  }

  const pI=ov/w*.6;pres[a]+=pI;pres[b]+=pI;
  const vt=tl/dt;
  if(rn>2.5||vt>4.0){
    const ma=pm[a],mb=pm[b],bio=isBio(ma)||isBio(mb);
    const eNorm=rn>2.5?0.5*(rn-2.5)*(rn-2.5)/w*0.013:0;
    const eFric=vt>4.0?(vt-4.0)*ov*mu/w*0.022:0;
    const e=eNorm+eFric;
    hitE+=e;
    if(!bio){
      T[a]=Math.min(1.75,T[a]+Math.min(0.35,e*0.48*wa));
      T[b]=Math.min(1.75,T[b]+Math.min(0.35,e*0.48*wb));
    }else if(rn>4.8&&sparkN<MAXS*.80&&Math.random()<0.25){
      spark((qx[a]+qx[b])*.5,(qy[a]+qy[b])*.5,(Math.random()-.5)*4.2,(Math.random()-.5)*4.2-1,26+Math.random()*28,1.2+Math.random()*0.8,1);
    }
    if(rn>5.0&&(isEX(ma)||isEX(mb))){
      if(isEX(ma))igniteE(a,1);
      if(isEX(mb))igniteE(b,1);
    }
    const vComb=rn+vt*0.6;
    if(!bio&&vComb>10.5&&sparkN<MAXS*.78&&Math.random()<.04){
      const sx=(qx[a]+qx[b])*.5,sy=(qy[a]+qy[b])*.5;
      const tangX=tl>1e-5?tx/tl:0,tangY=tl>1e-5?ty/tl:0;
      spark(sx,sy,-nx*rn*.11+tangX*vt*.15+(Math.random()-.5)*3.0,-ny*rn*.11+tangY*vt*.15+(Math.random()-.5)*3.0,18+Math.random()*24,1.0+Math.random()*0.9,0);
    }
  }
  if(stat&&(ov>0.42||cb*cb>0.045))wake(b);
}

function solveCollisions(dt){
  const stride=(actCount>2400&&projs.length===0)?2:1;
  const offset=stepCounter&1;
  for(let k=(stride===2?offset:0);k<actCount;k+=stride){
    const a=act[k];if(!(flg[a]&ALIVE))continue;
    let cx=(qx[a]/CELL)|0,cy=(qy[a]/CELL)|0;
    if(cx<0)cx=0;else if(cx>=GX)cx=GX-1;
    if(cy<0)cy=0;else if(cy>=GY)cy=GY-1;
    const x0=cx>0?cx-1:0,x1=cx<GX-1?cx+1:GX-1,y0=cy>0?cy-1:0,y1=cy<GY-1?cy+1:GY-1;
    for(let yy=y0;yy<=y1;yy++){
      const row=yy*GX;
      for(let s=dStart[row+x0],e=dStart[row+x1+1];s<e;s++){
        const b=dItems[s];if(b<=a||!(flg[b]&ALIVE))continue;
        pair(a,b,dt,false);
      }
      for(let s=sStart[row+x0],e=sStart[row+x1+1];s<e;s++){
        pair(a,sItems[s],dt,true);
      }
    }
  }
}

function substep(dt,iters){
  const n=actCount;
  for(let k=0;k<n;k++){
    const i=act[k];
    if(isPinned[i]){
      if(deg[i]===0){isPinned[i]=0;}
      else{qx[i]=px[i]=ox0[i];qy[i]=py[i]=oy0[i];vx[i]=vy[i]=0;continue;}
    }
    let g;
    if(flg[i]&PROJ)g=GRAV_PROJ;
    else if(deg[i]===0)g=GRAV;
    else if(!suppVis[i])g=GRAV_STRUCT;
    else g=0;
    if(g)vy[i]+=g*dt;
    qx[i]=px[i]+vx[i]*dt;qy[i]=py[i]+vy[i]*dt;
  }
  hashBuild(act,n,dStart,dFill,dItems,dCell,true,false);
  for(let it=0;it<iters;it++){
    solveBonds(dt);
    solveCollisions(dt);
  }
  let ms=0;
  for(let k=0;k<actCount;k++){
    const i=act[k];if(!(flg[i]&ALIVE))continue;
    if(isPinned[i]){
      px[i]=qx[i]=ox0[i];py[i]=qy[i]=oy0[i];vx[i]=vy[i]=0;continue;
    }
    let nvx=(qx[i]-px[i])/dt,nvy=(qy[i]-py[i])/dt;
    let s2=nvx*nvx+nvy*nvy;
    // Быстрое затухание мелких колебаний при изгибе и падении для высокой производительности
    if(!(flg[i]&PROJ)&&deg[i]>=2&&suppVis[i]){
      const damp=s2<0.85?0.52:0.88;nvx*=damp;nvy*=damp;
    }else if(!(flg[i]&PROJ)&&!suppVis[i]&&py[i]>WH-35){
      nvx*=0.82;nvy*=0.82;
    }else{
      const fr=deg[i]===0?.014:.006,damp=1-fr*dt;nvx*=damp;nvy*=damp;
    }
    s2=nvx*nvx+nvy*nvy;
    if(s2>1600){const s=40/Math.sqrt(s2);nvx*=s;nvy*=s;s2=1600;}
    let nx=qx[i],ny=qy[i];
    if(ny>WH-WALL_R){
      ny=WH-WALL_R;
      const mu=MU[pm[i]];
      if(nvy>0)nvy=-nvy*(0.20-mu*0.16);
      if(Math.abs(nvy)<0.35)nvy=0;
      nvx*=(1-mu*0.48);
      if(Math.abs(nvx)<0.08)nvx=0;
    }
    if(ny<WALL_R){ny=WALL_R;if(nvy<0)nvy=-nvy*0.3;}
    if(nx<WALL_R){nx=WALL_R;if(nvx<0)nvx=-nvx*0.35;}
    else if(nx>WW-WALL_R){nx=WW-WALL_R;if(nvx>0)nvx=-nvx*0.35;}
    vx[i]=nvx;vy[i]=nvy;px[i]=nx;py[i]=ny;qx[i]=nx;qy[i]=ny;
    if(s2>ms)ms=s2;
  }
  maxSp=Math.sqrt(ms);
}

function rebuildActB(){
  for(let t=0;t<actBCount;t++)bAct[actB[t]]=0;
  actBCount=0;
  for(let k=0;k<actCount;k++){
    const base=act[k]*SL;
    for(let s=0;s<SL;s++){const b=pb[base+s];if(b>=0&&!bAct[b]){bAct[b]=1;actB[actBCount++]=b;}}
  }
}
function compactAct(){
  let w=0;
  for(let k=0;k<actCount;k++){const i=act[k];if((flg[i]&ALIVE)&&awake[i]!==0)act[w++]=i;}
  actCount=w;
}

function stepFrame(){
  stepCounter++;
  if(supportDirty&&(stepCounter%8===0))updateSupport(true);
  compactAct();
  updateProjectiles();
  recordFlightStep();
  if(actCount>0&&(projs.length>0||stepCounter%4===0)){
    hashBuild(null,nP,sStart,sFill,sItems,sCell,false,true);
  }
  rebuildActB();
  brkF=0;hitE=0;detF=0;
  let n, iters;
  if(projs.length>0||maxSp>14){
    n=Math.ceil(maxSp*ts/2.4);
    n=n<2?2:n>4?4:n;
    iters=actCount>1800?1:ITER;
  }else{
    n=actCount>900?1:2;
    iters=1;
  }
  const dt=ts/n;
  for(let s=0;s<n;s++)substep(dt,iters);
  postFrame(n);
}

function postFrame(n){
  processDet();
  const dtf=ts;
  for(let t=0;t<actBCount;t++){
    const k=actB[t];if(!bAlive[k])continue;
    const a=bA[k],b=bB[k],ta=T[a],tb=T[b];
    if(ta<0.18&&tb<0.18)continue;
    const df=ta-tb;
    if(df>0.04||df<-0.04){const f=df*0.015*dtf;T[a]=ta-f;T[b]=tb+f;}
  }

  let mT=0,pM=0;
  const inv=1/n;
  for(let i=0;i<nP;i++){
    if(!(flg[i]&ALIVE))continue;

    // Автоматическое удаление осколков, упавших секций и мусора на полу через 2 секунды (120 кадров)
    const isDebris=(!isPinned[i])&&(deg[i]<=1||(!suppVis[i]&&py[i]>WH-42)||(flg[i]&LIQ));
    if(isDebris&&py[i]>WH-42){
      floorT[i]++;
      if(floorT[i]>=FLOOR_DESPAWN_FRAMES){
        kill(i);
        continue;
      }
    }else if(floorT[i]>0){
      floorT[i]=0;
    }

    let t=T[i];
    if(awake[i]===0&&t===0&&prD[i]===0&&strD[i]===0)continue;
    if(t>0.003){
      const cool=(0.0032+t*0.014+t*t*0.012)*dtf;
      t=t>cool?t-cool:0;
      if(t>1.75)t=1.75;
      T[i]=t;
      if(t>mT)mT=t;
      const m=pm[i];
      if(deg[i]>0&&t>MELT[m]&&Math.random()<.25){
        const base=i*SL;
        for(let s=0;s<SL;s++){const k=pb[base+s];if(k>=0&&Math.random()<.4)breakBond(k,false);}
        if(deg[i]===0)flg[i]|=LIQ;
      }
      if(isEX(m)&&t>.65)igniteE(i,2);
    }else if(t!==0){
      T[i]=0;
      if(pm[i]!==M.WATER&&pm[i]!==M.BLOOD)flg[i]&=~LIQ;
    }
    const pp=pres[i];
    if(pp!==0||prD[i]>1e-4){
      const v=prD[i]*.5+pp*inv*.5;
      prD[i]=v<1e-4?0:v;pres[i]=0;if(v>pM)pM=v;
    }else if(prD[i]!==0)prD[i]=0;
    const ss=str[i];
    if(ss!==0||strD[i]>1e-4){
      const v=ss>strD[i]*.9?ss:strD[i]*.9;
      strD[i]=v<1e-4?0:v;str[i]=0;
    }else if(strD[i]!==0)strD[i]=0;
    const x=px[i],y=py[i];
    if(x<-30||x>WW+30||y<-30||y>WH+30)kill(i);
  }
  maxT=mT;if(mT>peakT)peakT=mT;
  pScale=Math.max(pScale*.992,pM,.4);

  for(let k=0;k<actCount;k++){
    const i=act[k];if(!(flg[i]&ALIVE))continue;
    const s2=vx[i]*vx[i]+vy[i]*vy[i];
    // Быстрое усыпление слегка покачивающихся при изгибе блоков
    const sleepThr=(deg[i]>=2&&suppVis[i])?0.012:0.0035;
    if(s2>sleepThr)awake[i]=SLEEPF;
    else if(deg[i]===0&&py[i]<WH-WALL_R-4)awake[i]=SLEEPF;
    else if(--awake[i]<=0){awake[i]=0;vx[i]=vy[i]=0;qx[i]=px[i];qy[i]=py[i];}
  }

  // Искры и капли крови (без тяжёлого O(N^2) цикла столкновений искр друг с другом)
  for(let i=0;i<MAXS&&sparkN>0;i++){
    if(sl[i]<=0)continue;
    svy[i]+=GRAV_SPARK*dtf;
    const drag=skind[i]===1?0.992:0.988;
    svx[i]*=drag;svy[i]*=drag;
    sxA[i]+=svx[i]*dtf;syA[i]+=svy[i]*dtf;sl[i]-=dtf;
    if(syA[i]>WH-3){
      syA[i]=WH-3;
      svy[i]*=-0.25;svx[i]*=0.55;
      sl[i]-=1.8; // Быстрое исчезновение искр на полу
    }
    if(sxA[i]<1){sxA[i]=1;svx[i]*=-.5;}else if(sxA[i]>WW-1){sxA[i]=WW-1;svx[i]*=-.5;}
    const so=cellSolid(sxA[i],syA[i]);
    if(so>=0){
      const dx=sxA[i]-px[so],dy=syA[i]-py[so];
      const d=Math.hypot(dx,dy)||.001,inv_=1/d;
      const nx2=dx*inv_,ny2=dy*inv_;
      let pen=RC+srad[i]-d;if(pen>SP*2.2)pen=SP*2.2;
      if(pen>0){sxA[i]+=nx2*pen;syA[i]+=ny2*pen;}
      const vn=svx[i]*nx2+svy[i]*ny2;
      if(vn<0){
        svx[i]-=1.35*vn*nx2;svy[i]-=1.35*vn*ny2;
        sl[i]-=2.5;
      }
    }
    if(sl[i]<=0)sparkN--;
  }

  sampleBullets();
  for(let i=0;i<MAXG&&gasN>0;i++){
    if(gl[i]<=0)continue;
    const kind=gkind[i],f=gl[i]/gm[i];
    if(kind===0){
      gvy[i]-=1.4*dtf;gvx[i]*=.94;gvy[i]*=.94;
    }else{
      gvy[i]-=(kind===1?1.7:0.65)*dtf;
      gvx[i]+=Math.sin(simT*3+gseed[i])*1.4*dtf;
      gvx[i]*=.965;gvy[i]*=.965;
      if(gvy[i]<-1.6)gvy[i]=-1.6;if(gvy[i]>1)gvy[i]=1;
      gs[i]=gs0[i]*(1+(1-f)*1.8);
    }
    if(bulN>0){
      for(let b=0;b<bulN;b++){
        const bdx=gx[i]-bulX[b],bdy=gy[i]-bulY[b],bd2=bdx*bdx+bdy*bdy;
        if(bd2<324&&bd2>1e-6){
          const bd=Math.sqrt(bd2),ux=bdx/bd,uy=bdy/bd,k=1-bd/18;
          gvx[i]+=ux*k*1.2+bulVX[b]*0.15*k;
          gvy[i]+=uy*k*1.2+bulVY[b]*0.15*k;
          if(kind!==0)gl[i]-=1.2*k;
        }
      }
    }
    gx[i]+=gvx[i]*dtf;gy[i]+=gvy[i]*dtf;gl[i]-=dtf;
    if(gy[i]<2){gy[i]=2;gvy[i]*=-.2;}
    if(gx[i]<2){gx[i]=2;if(gvx[i]<0)gvx[i]*=-.45;}
    else if(gx[i]>WW-2){gx[i]=WW-2;if(gvx[i]>0)gvx[i]*=-.45;}
    const so=cellSolid(gx[i],gy[i]);
    if(so>=0){
      const dx=gx[i]-px[so],dy=gy[i]-py[so];
      const d=Math.hypot(dx,dy)||.001,inv_=1/d;
      const nx2=dx*inv_,ny2=dy*inv_;
      const pen=RC+gs[i]*0.75-d;
      if(pen>0){const p=pen>SP?SP:pen;gx[i]+=nx2*p;gy[i]+=ny2*p;}
      const vn=gvx[i]*nx2+gvy[i]*ny2;
      if(vn<0){
        gvx[i]-=1.25*vn*nx2;gvy[i]-=1.25*vn*ny2;
        gl[i]-=1.5;
      }
    }
    if(gl[i]<=0)gasN--;
  }

  for(let i=flashes.length-1;i>=0;i--){
    const fl=flashes[i];
    fl.life-=fl.decay*dtf;
    if(fl.life<=0)flashes.splice(i,1);
  }
  camShake*=0.84;
  if(camShake<0.05)camShake=0;

  if(shotFrames>=0)shotFrames+=ts;
  simT+=ts;
  if(detF>0){if(simT-lastSnd>1.1){lastSnd=simT;sndBoom(Math.min(1,.35+detF/26));}}
  else if(hitE>1.5){if(simT-lastSnd>1.0){lastSnd=simT;sndHit(Math.min(1,hitE/20));}}
  else if(brkF>4){if(simT-lastSnd>.8){lastSnd=simT;sndCrack(Math.min(1,brkF/40));}}
}

/* ================= РЕНДЕР И СВЕЧЕНИЕ (НЕ ПРОХОДЯЩЕЕ СКВОЗЬ БЛОКИ) ================= */
function buildBloomOcclusion(){
  g1Occ.fill(0);
  // Клетка G1 (4x4 пикселя) помечается непрозрачной, если в ней есть холодный твёрдый блок
  for(let cy=0;cy<LY;cy++){
    const gy_=(cy*SP)>>2;
    if(gy_>=G1H)continue;
    const rowOcc=cy*LX, rowG=gy_*G1W;
    for(let cx=0;cx<LX;cx++){
      const o=occ[rowOcc+cx];
      if(o>=0&&(flg[o]&ALIVE)&&T[o]<0.22&&pm[o]!==M.GLASS&&pm[o]!==M.WATER){
        const gx_=(cx*SP)>>2;
        if(gx_<G1W)g1Occ[rowG+gx_]=1;
      }
    }
  }
}

function glowAddClamped(buf,w,sx,sy,x,y,r,g,b,capR,capG,capB,checkOcc){
  const gx_=(x/sx)|0,gy_=(y/sy)|0;
  if(gx_<0||gy_<0||gx_>=w)return;
  const idx=gy_*w+gx_;
  if(checkOcc&&g1Occ[idx])return; // Блум не засвечивает сквозь непрозрачные блоки
  const o=idx*4;
  if(o+3>=buf.length)return;
  buf[o]=Math.min(capR,buf[o]+r);
  buf[o+1]=Math.min(capG,buf[o+1]+g);
  buf[o+2]=Math.min(capB,buf[o+2]+b);
}
function emitBloom(x,y,t){
  if(!glowOn||glowMul<=0||t<0.28)return;
  const k=Math.min(1,(t-0.28)*0.85)*glowMul;
  const capR=(170*glowMul)|0,capG=(85*glowMul)|0,capB=(24*glowMul)|0;
  glowAddClamped(g1b,G1W,4,4,x,y,165*k,75*k*k,16*k*k*k,capR,capG,capB,true);
  if(t>0.62){
    const k2=(t-0.62)*0.42*glowMul;
    glowAddClamped(g2b,G2W,12,12,x,y,105*k2,38*k2,8*k2,(95*glowMul)|0,(34*glowMul)|0,(10*glowMul)|0,false);
  }
}
function blurG1(){
  g1Tmp.set(g1b);
  const w=G1W,h=G1H,row=w*4;
  for(let y=1;y<h-1;y++){
    let idx=y*w+1, o=idx*4;
    for(let x=1;x<w-1;x++,idx++,o+=4){
      // Если клетка закрыта блоком, свечение огня через неё не проходит!
      if(g1Occ[idx]){
        g1b[o]=0;g1b[o+1]=0;g1b[o+2]=0;
        continue;
      }
      const cR=g1Tmp[o],cG=g1Tmp[o+1],cB=g1Tmp[o+2];
      const lOcc=g1Occ[idx-1]?0:1, rOcc=g1Occ[idx+1]?0:1, uOcc=g1Occ[idx-w]?0:1, dOcc=g1Occ[idx+w]?0:1;
      const nR=g1Tmp[o-4]*lOcc+g1Tmp[o+4]*rOcc+g1Tmp[o-row]*uOcc+g1Tmp[o+row]*dOcc;
      const nG=g1Tmp[o-3]*lOcc+g1Tmp[o+5]*rOcc+g1Tmp[o-row+1]*uOcc+g1Tmp[o+row+1]*dOcc;
      const nB=g1Tmp[o-2]*lOcc+g1Tmp[o+6]*rOcc+g1Tmp[o-row+2]*uOcc+g1Tmp[o+row+2]*dOcc;
      if((cR|nR)===0&&(cG|nG)===0)continue;
      g1b[o]=(cR*4+nR)>>3;g1b[o+1]=(cG*4+nG)>>3;g1b[o+2]=(cB*4+nB)>>3;
    }
  }
}
function addPx(x,y,r,g,b){
  const xi=x|0,yi=y|0;
  if(xi<0||yi<0||xi>=WW||yi>=WH)return;
  // Огонь не рисуется поверх непрозрачных холодных блоков стены
  const c=((yi/SP)|0)*LX+((xi/SP)|0);
  const oBlk=occ[c];
  if(oBlk>=0&&(flg[oBlk]&ALIVE)&&T[oBlk]<0.25&&pm[oBlk]!==M.GLASS)return;
  const o=(yi*WW+xi)*4;
  buf8[o]=Math.min(255,buf8[o]+r);
  buf8[o+1]=Math.min(255,buf8[o+1]+g);
  buf8[o+2]=Math.min(255,buf8[o+2]+b);
}
function drawFire(){
  for(let i=0;i<MAXG&&gasN>0;i++){
    if(gl[i]<=0||gkind[i]!==0)continue;
    const l=gl[i],f=l/gm[i],rad=gs[i]*(1.65-f*.75);
    const br=f<.25?f*4:1,x=gx[i],y=gy[i];
    const R=Math.ceil(rad),rad2=rad*rad,inv=1/rad;
    const core=Math.min(1,f*2.1);
    const gr=(90+150*f*core)*br,bb=(20+85*f*f)*br,rr=245*br;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      const d2=dx*dx+dy*dy;if(d2>rad2)continue;
      const a=1-Math.sqrt(d2)*inv,k=a*a,cc=(.42+.58*core)*k;
      addPx(x+dx,y+dy,rr*cc,gr*k,bb*k);
    }
    emitBloom(x,y,0.42+f*br*0.58);
  }
}
function drawSmoke(){
  for(let i=0;i<MAXG&&gasN>0;i++){
    if(gl[i]<=0||gkind[i]!==1)continue;
    const f=gl[i]/gm[i],rad=gs[i]*2.1;
    if(rad<1)continue;
    const x=gx[i],y=gy[i];
    if(x<-rad||y<-rad||x>WW+rad||y>WH+rad)continue;
    const alpha=f>.75?(1-f)*4*.36:(f*.32+.04);
    if(alpha<=0.02)continue;
    octx.globalAlpha=Math.min(.38,alpha);
    octx.drawImage(sprSmoke,x-rad,y-rad,rad*2,rad*2);
  }
  for(let i=0;i<MAXG&&gasN>0;i++){
    if(gl[i]<=0||gkind[i]!==2)continue;
    const f=gl[i]/gm[i],rad=gs[i]*2.05;
    if(rad<1)continue;
    const x=gx[i],y=gy[i];
    if(x<-rad||y<-rad||x>WW+rad||y>WH+rad)continue;
    const alpha=f*.24+.03;
    if(alpha<=0.02)continue;
    octx.globalAlpha=Math.min(.32,alpha);
    octx.drawImage(sprDust,x-rad,y-rad,rad*2,rad*2);
  }
  octx.globalAlpha=1;
}

// Овальные частицы ТОЛЬКО для оторванных обломков (deg[i] <= 1 && !(flg[i] & PROJ)), НЕ для снарядов и НЕ для построек!
function traceParticleShape(i,R){
  const x=px[i],y=py[i];
  if(deg[i]<=1&&!(flg[i]&PROJ)){
    const vx_=vx[i],vy_=vy[i],s2=vx_*vx_+vy_*vy_;
    if(s2>=0.18){
      const stretch=1+Math.min(2.1,Math.sqrt(s2)*0.17);
      const rx=R*stretch,ry=R/Math.sqrt(stretch),ang=Math.atan2(vy_,vx_);
      ctx.moveTo(x+rx*Math.cos(ang),y+rx*Math.sin(ang));
      ctx.ellipse(x,y,rx,ry,ang,0,6.2832);
      return;
    }
  }
  // Для построек и снарядов — круглая/цельная форма без растягивания в овал
  ctx.moveTo(x+R,y);
  ctx.arc(x,y,R,0,6.2832);
}

function drawParticles(){
  const v=view,pInv=1/pScale,R=PRAD,pad=R*3.4;
  const minX=Math.max(1,-effX/effS-pad),maxX=Math.min(WW-1,(cw-effX)/effS+pad);
  const minY=Math.max(1,-effY/effS-pad),maxY=Math.min(WH-1,(ch-effY)/effS+pad);

  ctx.save();
  ctx.setTransform(effS,0,0,effS,effX,effY);

  if(v===0){
    matShadeHead.fill(-1);hotHead.fill(-1);
    for(let i=0;i<nP;i++){
      if(!(flg[i]&ALIVE))continue;
      const x=px[i],y=py[i];
      if(x<minX||x>maxX||y<minY||y>maxY)continue;
      const t=T[i];
      let hk=-1;
      if(t>=0.02&&!isBio(pm[i])){
        hk=Math.min(HEAT_BINS-1,((t/1.55)*HEAT_BINS)|0);
        pNextHot[i]=hotHead[hk];hotHead[hk]=i;
        if(t>0.28)emitBloom(x,y,t);
      }
      if(hk<HEAT_SOLID_BIN){
        const ms=pm[i]*3+(shade[i]%3);
        pNext[i]=matShadeHead[ms];matShadeHead[ms]=i;
      }
    }
    for(let ms=3;ms<MAT.length*3;ms++){
      let i=matShadeHead[ms];if(i<0)continue;
      ctx.fillStyle=MAT_SHADE_CSS[ms];ctx.beginPath();
      while(i>=0){traceParticleShape(i,R);i=pNext[i];}
      ctx.fill();
    }
    for(let hk=0;hk<HEAT_BINS;hk++){
      let i=hotHead[hk];if(i<0)continue;
      ctx.fillStyle=HEAT_CSS[hk];ctx.beginPath();
      while(i>=0){traceParticleShape(i,R);i=pNextHot[i];}
      ctx.fill();
    }
  }else{
    hotHead.fill(-1);
    for(let i=0;i<nP;i++){
      if(!(flg[i]&ALIVE))continue;
      const x=px[i],y=py[i];
      if(x<minX||x>maxX||y<minY||y>maxY)continue;
      let k;
      if(v===1)k=(prD[i]*pInv*1.15*31)|0;
      else if(v===2)k=(strD[i]*5*31)|0;
      else{const t=T[i];k=(t*16)|0;if(t>0.28)emitBloom(x,y,t);}
      k=k>31?31:(k<0?0:k);
      pNext[i]=hotHead[k];hotHead[k]=i;
    }
    const pal=v===3?THERM_VIEW_CSS:PL_CSS;
    for(let k=0;k<32;k++){
      let i=hotHead[k];if(i<0)continue;
      ctx.fillStyle=pal[k];ctx.beginPath();
      while(i>=0){traceParticleShape(i,R);i=pNext[i];}
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawSparksAndExplosions(){
  ctx.save();
  ctx.setTransform(effS,0,0,effS,effX,effY);

  if(sparkN>0){
    ctx.fillStyle='rgba(175,16,28,0.92)';
    ctx.beginPath();
    for(let i=0;i<MAXS;i++){
      if(sl[i]<=0||skind[i]!==1)continue;
      const x=sxA[i],y=syA[i],vx_=svx[i],vy_=svy[i],sp=Math.hypot(vx_,vy_);
      const ang=Math.atan2(vy_,vx_),rad=srad[i]*(0.65+0.35*(sl[i]/sm[i]));
      const rx=rad*(1+Math.min(1.6,sp*0.16)),ry=rad*0.85;
      ctx.moveTo(x+rx*Math.cos(ang),y+rx*Math.sin(ang));
      ctx.ellipse(x,y,rx,ry,ang,0,6.2832);
    }
    ctx.fill();
  }

  // Мягкие вспышки детонации без колец
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<flashes.length;i++){
    const fl=flashes[i],r=fl.rad*(1.2-0.2*fl.life);
    const gr=ctx.createRadialGradient(fl.x,fl.y,1,fl.x,fl.y,r);
    if(fl.uran){
      gr.addColorStop(0,'rgba(220,255,220,'+(fl.life*0.65)+')');
      gr.addColorStop(0.4,'rgba(90,235,110,'+(fl.life*0.38)+')');
      gr.addColorStop(1,'rgba(20,120,30,0)');
    }else{
      gr.addColorStop(0,'rgba(255,245,215,'+(fl.life*0.52)+')');
      gr.addColorStop(0.38,'rgba(255,155,45,'+(fl.life*0.32)+')');
      gr.addColorStop(1,'rgba(255,70,10,0)');
    }
    ctx.fillStyle=gr;
    ctx.beginPath();ctx.arc(fl.x,fl.y,r,0,6.2832);ctx.fill();
  }

  if(sparkN>0){
    ctx.fillStyle='rgba(255,128,28,0.68)';
    ctx.beginPath();
    for(let i=0;i<MAXS;i++){
      const l=sl[i];if(l<=0||skind[i]===1)continue;
      const x=sxA[i],y=syA[i],f=l/sm[i];
      emitBloom(x,y,0.28+f*0.38);
      const vx_=svx[i],vy_=svy[i],sp=Math.hypot(vx_,vy_),ang=Math.atan2(vy_,vx_);
      const rad=srad[i]*(0.5+0.5*f),rx=rad*(1.2+Math.min(2.4,sp*0.22))*1.2,ry=rad*1.05;
      ctx.moveTo(x+rx*Math.cos(ang),y+rx*Math.sin(ang));
      ctx.ellipse(x,y,rx,ry,ang,0,6.2832);
    }
    ctx.fill();

    ctx.fillStyle='rgba(255,246,210,0.92)';
    ctx.beginPath();
    for(let i=0;i<MAXS;i++){
      const l=sl[i];if(l<=0||skind[i]===1)continue;
      const f=l/sm[i];if(f<0.25)continue;
      const x=sxA[i],y=syA[i],vx_=svx[i],vy_=svy[i],sp=Math.hypot(vx_,vy_),ang=Math.atan2(vy_,vx_);
      const rad=srad[i]*(0.4+0.5*f),rx=rad*(1.1+Math.min(2.0,sp*0.18)),ry=rad*0.75;
      ctx.moveTo(x+rx*Math.cos(ang),y+rx*Math.sin(ang));
      ctx.ellipse(x,y,rx,ry,ang,0,6.2832);
    }
    ctx.fill();
  }

  ctx.restore();
}

function render(){
  buf32.set(bg32);
  if(glowOn&&glowMul>0){
    g1u.fill(0xFF000000);
    g2u.fill(0xFF000000);
    buildBloomOcclusion();
  }
  drawFire();
  octx.putImageData(img,0,0);
  drawSmoke();
  ctx.fillStyle='#05070a';ctx.fillRect(0,0,cw,ch);
  ctx.imageSmoothingEnabled=true;
  camUpdate();
  const W=WW*effS,H=WH*effS;
  ctx.drawImage(off,effX,effY,W,H);
  drawParticles();
  drawSparksAndExplosions();

  if(glowOn&&glowMul>0){
    blurG1();
    g1x.putImageData(g1i,0,0);
    g2x.putImageData(g2i,0,0);
    ctx.globalCompositeOperation='lighter';
    ctx.globalAlpha=0.72;ctx.drawImage(g1c,effX,effY,W,H);
    ctx.globalAlpha=0.45;ctx.drawImage(g2c,effX,effY,W,H);
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  }
  drawOverlay();
}

/* ================= ИНСТРУМЕНТЫ СТРОИТЕЛЬСТВА (ВКЛЮЧАЯ PLATE) И ПРЕВЬЮ ================= */
let tool='fire', stampType='mannequin', brushR=4, brushSq=false, mouseDown=false, downP=null, curP={x:WW/2,y:WH/2}, lastP=null, curMat=M.CONC, lastFire=null;
let customStampCells=[];

function getPinFlag(cy,mat){
  if(pinMode==='on')return true;
  if(pinMode==='off')return false;
  return cy>=LY-4&&!isBio(mat);
}

function floodFillWorld(startCx,startCy,newMat){
  if(startCx<0||startCy<0||startCx>=LX||startCy>=LY)return;
  const startIdx=startCy*LX+startCx;
  const o0=occ[startIdx];
  const targetMat=(o0>=0&&(flg[o0]&ALIVE))?pm[o0]:0;
  if(targetMat===newMat)return;
  const vis=new Uint8Array(LX*LY);
  const q=new Int32Array(LX*LY);
  let head=0,tail=0;
  vis[startIdx]=1;q[tail++]=startIdx;
  let count=0,maxFill=9500;
  while(head<tail&&count<maxFill){
    const c=q[head++],cx=c%LX,cy=(c/LX)|0;
    if(newMat===0){
      const o=occ[c];if(o>=0&&(flg[o]&ALIVE))kill(o);
    }else{
      putCell(cx,cy,newMat,getPinFlag(cy,newMat));
    }
    count++;
    const nbs=[c-1,c+1,c-LX,c+LX];
    for(let k=0;k<4;k++){
      const nc=nbs[k];
      if(k===0&&cx===0||k===1&&cx===LX-1||k===2&&cy===0||k===3&&cy===LY-1)continue;
      if(vis[nc])continue;
      const no=occ[nc],nm=(no>=0&&(flg[no]&ALIVE))?pm[no]:0;
      if(nm===targetMat){vis[nc]=1;q[tail++]=nc;}
    }
  }
}

// Получение клеток для Кисти, Плиты (plate), Линии, Блока и Рамки
function getShapeCells(tMode,c0x,c0y,c1x,c1y,r,sq){
  const out=[];
  const addBrush=(cx,cy)=>{
    const R=r-1;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      if(!sq&&dx*dx+dy*dy>R*R+0.35)continue;
      out.push(cx+dx,cy+dy);
    }
  };
  if(tMode==='paint'||tMode==='erase'){
    addBrush(c1x,c1y);
  }else if(tMode==='line'){
    const dx=c1x-c0x,dy=c1y-c0y,steps=Math.max(1,Math.hypot(dx,dy)|0);
    for(let s=0;s<=steps;s++)addBrush(Math.round(c0x+dx*s/steps),Math.round(c0y+dy*s/steps));
  }else if(tMode==='plate'){
    // Инструмент Плита (plate): строит ровную или наклонную бронеплиту заданной толщины с точными гранями
    const dx=c1x-c0x,dy=c1y-c0y,len=Math.hypot(dx,dy);
    const halfT=Math.max(0.5,(r-0.5));
    if(len<1){
      for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)out.push(c0x+x,c0y+y);
    }else{
      const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;
      const minX=Math.floor(Math.min(c0x,c1x)-halfT-1),maxX=Math.ceil(Math.max(c0x,c1x)+halfT+1);
      const minY=Math.floor(Math.min(c0y,c1y)-halfT-1),maxY=Math.ceil(Math.max(c0y,c1y)+halfT+1);
      for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){
        const px_=x-c0x,py_=y-c0y;
        const projU=px_*ux+py_*uy, projV=px_*nx+py_*ny;
        if(projU>=-0.5&&projU<=len+0.5&&Math.abs(projV)<=halfT){
          out.push(x,y);
        }
      }
    }
  }else if(tMode==='rect'||tMode==='box'){
    const x0=Math.min(c0x,c1x),x1=Math.max(c0x,c1x),y0=Math.min(c0y,c1y),y1=Math.max(c0y,c1y);
    const th=Math.max(1,r);
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
      if(tMode==='box'&&x>=x0+th&&x<=x1-th&&y>=y0+th&&y<=y1-th)continue;
      out.push(x,y);
    }
  }
  return out;
}

function applyCellsToWorld(coords,mat,erase,isPlateMode){
  for(let i=0;i<coords.length;i+=2){
    const cx=coords[i],cy=coords[i+1];
    if(cx<0||cy<0||cx>=LX||cy>=LY)continue;
    if(erase){
      const o=occ[cy*LX+cx];if(o>=0&&(flg[o]&ALIVE))kill(o);
      const row=cy*GX+cx;
      for(let s=dStart[row],e=dStart[row+1];s<e;s++){const j=dItems[s];if(flg[j]&ALIVE)kill(j);}
      for(let s=sStart[row],e=sStart[row+1];s<e;s++){const j=sItems[s];if(flg[j]&ALIVE)kill(j);}
    }else{
      // Для функции Plate края плиты могут автоматически закрепляться при pinMode !== 'off'
      const edgePin=isPlateMode&&pinMode!=='off'&&(i<8||i>=coords.length-8||cy>=LY-4);
      putCell(cx,cy,mat,edgePin||getPinFlag(cy,mat));
    }
  }
}

function paintAt(p){
  const cx=(p.x/SP)|0,cy=(p.y/SP)|0;
  const cells=getShapeCells(tool,cx,cy,cx,cy,brushR,brushSq);
  applyCellsToWorld(cells,curMat,tool==='erase',false);
}
function strokeTo(p){
  if(!lastP){paintAt(p);lastP=p;return;}
  const dx=p.x-lastP.x,dy=p.y-lastP.y,n=Math.max(1,Math.ceil(Math.hypot(dx,dy)/(SP*0.9)));
  for(let s=1;s<=n;s++)paintAt({x:lastP.x+dx*s/n,y:lastP.y+dy*s/n});
  lastP=p;
}

function toWorld(e){
  const r=cv.getBoundingClientRect();
  camUpdate();
  return {x:((e.clientX-r.left)*dpr-effX)/effS,y:((e.clientY-r.top)*dpr-effY)/effS};
}

const pts=new Map();let panning=false,panS=null,pinchD=0,pinchC=null;
cv.addEventListener('pointerdown',e=>{
  audioInit();
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const a=[...pts.values()];
    pinchD=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    pinchC={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    mouseDown=false;downP=null;lastP=null;panning=false;panS=null;
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  if(e.button===1||e.button===2||e.shiftKey){
    panning=true;panS={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    return;
  }
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  const p=toWorld(e);mouseDown=true;downP=p;curP=p;lastP=null;
  const cx=(p.x/SP)|0,cy=(p.y/SP)|0;
  if(tool==='paint'||tool==='erase'){
    strokeTo(p);
  }else if(tool==='fill'){
    floodFillWorld(cx,cy,curMat);
    mouseDown=false;
  }else if(tool==='stamp'){
    if(stampType==='custom'){
      for(let i=0;i<customStampCells.length;i+=3){
        const x=cx+customStampCells[i],y=cy+customStampCells[i+1],m=customStampCells[i+2];
        putCell(x,y,m,getPinFlag(y,m));
      }
      updateSupport(false);
    }else{
      spawnPresetWorld(stampType,cx,cy);
    }
    mouseDown=false;
  }
});

cv.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){
    const a=[...pts.values()];
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const c={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    if(pinchD>0&&d>0)zoomAt(c.x,c.y,d/pinchD);
    camUpdate();
    cam.x-=(c.x-pinchC.x)*dpr/effS;cam.y-=(c.y-pinchC.y)*dpr/effS;
    pinchD=d;pinchC=c;
    return;
  }
  if(panning&&panS){
    camUpdate();
    cam.x=panS.cx-(e.clientX-panS.x)*dpr/effS;
    cam.y=panS.cy-(e.clientY-panS.y)*dpr/effS;
    return;
  }
  const p=toWorld(e);curP=p;
  if(mouseDown&&(tool==='paint'||tool==='erase'))strokeTo(p);
});

function endPress(e){
  if(e&&e.pointerId!==undefined)pts.delete(e.pointerId);
  if(pts.size>=2)return;
  pinchD=0;
  if(panning){panning=false;panS=null;mouseDown=false;downP=null;lastP=null;return;}
  if(!mouseDown)return;mouseDown=false;
  if(tool==='fire'&&downP){
    const dx=curP.x-downP.x,dy=curP.y-downP.y;
    if(Math.hypot(dx,dy)<12){fire(0,downP.y,0,true);lastFire={edge:true,y:downP.y};}
    else{const a=Math.atan2(dy,dx);fire(downP.x,downP.y,a,false);lastFire={edge:false,x:downP.x,y:downP.y,a};}
  }else if((tool==='line'||tool==='plate'||tool==='rect'||tool==='box')&&downP){
    const c0x=(downP.x/SP)|0,c0y=(downP.y/SP)|0,c1x=(curP.x/SP)|0,c1y=(curP.y/SP)|0;
    const cells=getShapeCells(tool,c0x,c0y,c1x,c1y,brushR,brushSq);
    applyCellsToWorld(cells,curMat,false,tool==='plate');
  }
  lastP=null;downP=null;
}
cv.addEventListener('pointerup',endPress);

/* ================= ПРЕВЬЮ СНАРЯДА, ПОВТОРА ПОЛЁТА И ИНСТРУМЕНТОВ НА КАРТЕ ================= */
function drawProjGhostOnWorld(nx,ny,ang){
  const def=PROJ_DEF[curProj];
  const sh=getScaledShape(def,projScale);
  const h=sh.length,w=sh[0].length,ca=Math.cos(ang),sa=Math.sin(ang);
  ctx.globalAlpha=0.72;
  for(let r=0;r<h;r++)for(let c=0;c<w;c++){
    const ch=sh[r][c];if(ch==='.')continue;
    const u=(c-(w-1))*SP,v=(r-(h-1)/2)*SP;
    const x=nx+u*ca-v*sa,y=ny+u*sa+v*ca;
    const m=PCH[ch]||M.STEEL, col=MAT[m].c;
    ctx.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')';
    ctx.fillRect(x-SP*0.5,y-SP*0.5,SP,SP);
  }
  ctx.globalAlpha=1;
}

function drawReplayOverlay(){
  if(!replayActive||!flightHistory.length)return;
  // Линия траектории снаряда
  ctx.strokeStyle='rgba(240,179,94,0.75)';
  ctx.lineWidth=1.5;
  ctx.setLineDash([4,3]);
  ctx.beginPath();
  for(let k=0;k<flightHistory.length;k++){
    const f=flightHistory[k];
    if(k===0)ctx.moveTo(f.cx,f.cy);
    else ctx.lineTo(f.cx,f.cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Точки замеров на траектории
  ctx.fillStyle='rgba(255,220,140,0.65)';
  for(let k=0;k<flightHistory.length;k+=4){
    const f=flightHistory[k];
    ctx.beginPath();ctx.arc(f.cx,f.cy,1.6,0,6.283);ctx.fill();
  }

  // Отрисовка положения снаряда в выбранный момент времени
  const frame=flightHistory[Math.min(flightHistory.length-1,replayIdx)];
  if(frame){
    const pts=frame.pts;
    for(let i=0;i<pts.length;i+=3){
      const x=pts[i],y=pts[i+1],m=pts[i+2],col=MAT[m].c;
      ctx.fillStyle='rgb('+col[0]+','+col[1]+','+col[2]+')';
      ctx.fillRect(x-SP*0.55,y-SP*0.55,SP*1.1,SP*1.1);
    }
    // Вектор скорости и подпись
    ctx.strokeStyle='#5cd66f';
    ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(frame.cx,frame.cy);
    ctx.lineTo(frame.cx+frame.vx*2.5,frame.cy+frame.vy*2.5);
    ctx.stroke();
    ctx.fillStyle='#fff';
    ctx.font='10px monospace';
    ctx.fillText(frame.spd+' м/с',frame.cx+8,frame.cy-8);
  }
}

function drawOverlay(){
  ctx.save();
  camUpdate();
  ctx.setTransform(effS,0,0,effS,effX,effY);
  ctx.lineWidth=1.1;
  const cx=(curP.x/SP)|0,cy=(curP.y/SP)|0;

  if(replayActive){
    drawReplayOverlay();
  }

  if(tool==='fire'){
    const def=PROJ_DEF[curProj];
    const sh=getScaledShape(def,projScale);
    const plen=sh[0].length*SP;
    if(mouseDown&&downP){
      const dx=curP.x-downP.x,dy=curP.y-downP.y,d=Math.hypot(dx,dy);
      if(d>=12){
        const a=Math.atan2(dy,dx),L=Math.max(60,d);
        ctx.strokeStyle='rgba(240,179,94,.8)';ctx.setLineDash([5,5]);
        ctx.beginPath();ctx.moveTo(downP.x,downP.y);ctx.lineTo(downP.x+Math.cos(a)*L,downP.y+Math.sin(a)*L);ctx.stroke();ctx.setLineDash([]);
        drawProjGhostOnWorld(downP.x,downP.y,a);
      }else{
        ctx.strokeStyle='rgba(240,179,94,.5)';ctx.setLineDash([3,6]);
        ctx.beginPath();ctx.moveTo(14,downP.y);ctx.lineTo(WW,downP.y);ctx.stroke();ctx.setLineDash([]);
        drawProjGhostOnWorld(8+plen,downP.y,0);
      }
    }else{
      ctx.strokeStyle='rgba(240,179,94,.22)';ctx.setLineDash([3,7]);
      ctx.beginPath();ctx.moveTo(14,curP.y);ctx.lineTo(WW,curP.y);ctx.stroke();ctx.setLineDash([]);
      // Живой предпросмотр реального размера снаряда прямо на линии прицеливания
      drawProjGhostOnWorld(8+plen,curP.y,0);
    }
  }else if(tool==='stamp'){
    ctx.globalAlpha=0.58;
    const drawPrev=(x,y,m)=>{
      if(!m)return;
      const c=MAT[m].c;
      ctx.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';
      ctx.fillRect(x*SP,y*SP,SP,SP);
    };
    if(stampType==='mannequin')drawMannequin(drawPrev,cx,cy);
    else if(stampType==='tank')drawTank(drawPrev,cx,cy);
    else if(stampType==='plane')drawPlane(drawPrev,cx,cy);
    else if(stampType==='house')drawHouse(drawPrev,cx,cy);
    else if(stampType==='five')drawFiveStory(drawPrev,cx,cy);
    else if(stampType==='custom'){
      for(let i=0;i<customStampCells.length;i+=3)drawPrev(cx+customStampCells[i],cy+customStampCells[i+1],customStampCells[i+2]);
    }
    ctx.globalAlpha=1;
  }else if(tool==='fill'){
    ctx.strokeStyle='rgba(240,179,94,.95)';
    ctx.strokeRect(cx*SP,cy*SP,SP,SP);
  }else{
    const c0x=(mouseDown&&downP)?((downP.x/SP)|0):cx;
    const c0y=(mouseDown&&downP)?((downP.y/SP)|0):cy;
    const cells=getShapeCells(tool,c0x,c0y,cx,cy,brushR,brushSq);
    const mc=MAT[curMat].c;
    ctx.fillStyle=tool==='erase'?'rgba(255,75,70,0.38)':'rgba('+mc[0]+','+mc[1]+','+mc[2]+',0.46)';
    ctx.beginPath();
    for(let i=0;i<cells.length;i+=2){
      ctx.rect(cells[i]*SP,cells[i+1]*SP,SP,SP);
    }
    ctx.fill();
  }
  ctx.restore();
}

/* ================= КАМЕРА ================= */
const cam={x:WW/2,y:WH/2,z:1};
let effS=1,effX=0,effY=0;
function camUpdate(){
  effS=sc*cam.z;
  const shX=camShake?(Math.random()-.5)*camShake*effS:0;
  const shY=camShake?(Math.random()-.5)*camShake*effS:0;
  effX=cw/2-cam.x*effS+shX;
  effY=ch/2-cam.y*effS+shY;
}
function zoomAt(px_,py_,f){
  const r=cv.getBoundingClientRect();
  const sx=(px_-r.left)*dpr,sy=(py_-r.top)*dpr;
  camUpdate();
  const wx=(sx-effX)/effS,wy=(sy-effY)/effS;
  cam.z=Math.min(14,Math.max(.5,cam.z*f));
  const s1=sc*cam.z;
  cam.x=Math.max(-200,Math.min(WW+200,wx-(sx-cw/2)/s1));
  cam.y=Math.max(-200,Math.min(WH+200,wy-(sy-ch/2)/s1));
}
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.altKey){
    setBrushSize(brushR+(e.deltaY<0?1:-1));
  }else{
    zoomAt(e.clientX,e.clientY,Math.pow(1.0015,-e.deltaY));
  }
},{passive:false});

    list.forEach((item,idx)=>{

          for(let i=0;i<snap.length;i+=3){
            const x=ox+snap[i],y=oy+snap[i+1],m=snap[i+2];
            putCell(x,y,m,y>=LY-4&&!isBio(m));
          }
        }
      };
      addSceneBtn(key,label);
    });
  }catch(_){}

    if(list.length>20)list.shift();
    localStorage.setItem(SAVED_BLD_KEY,JSON.stringify(list));

/* ================= УЛУЧШЕННЫЙ РЕДАКТОР СНАРЯДА (С ВЫБОРОМ ШИРИНЫ, ДЛИНЫ И ИНСТРУМЕНТАМИ) ================= */
let EW=12, EH=5, ECS=22;
let edGrid=new Uint8Array(EW*EH);
const edHist=[];
let edMat=M.STEEL, edTool='brush', edSz=1, edSym=false, edDown=false, edStart=null, edCur={x:0,y:0};
const edc=$('edc'), ex=edc.getContext('2d');

function resizeEdGrid(newW,newH){
  const next=new Uint8Array(newW*newH);
  const mw=Math.min(EW,newW), mh=Math.min(EH,newH);
  for(let y=0;y<mh;y++)for(let x=0;x<mw;x++)next[y*newW+x]=edGrid[y*EW+x];
  EW=newW;EH=newH;edGrid=next;
  ECS=Math.max(14,Math.min(26,Math.floor(520/Math.max(EW,EH))));
  edc.width=EW*ECS;edc.height=EH*ECS;
  $('edwv').textContent=EW;
  $('edhv').textContent=EH;
  edDraw();
}
resizeEdGrid(12,5);

function edPushHist(){
  edHist.push({w:EW,h:EH,g:new Uint8Array(edGrid)});
  if(edHist.length>20)edHist.shift();
}
function getEdCells(tMode,x0,y0,x1,y1,r){
  const out=[];
  const addPt=(cx,cy)=>{
    const R=r-1;
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
      const x=cx+dx,y=cy+dy;
      out.push(x,y);
      if(edSym)out.push(x,EH-1-y);
    }
  };
  if(tMode==='brush'||tMode==='erase'){
    addPt(x1,y1);
  }else if(tMode==='line'){
    const dx=x1-x0,dy=y1-y0,st=Math.max(1,Math.hypot(dx,dy)|0);
    for(let s=0;s<=st;s++)addPt(Math.round(x0+dx*s/st),Math.round(y0+dy*s/st));
  }else if(tMode==='rect'||tMode==='box'){
    const ax=Math.min(x0,x1),bx_=Math.max(x0,x1),ay=Math.min(y0,y1),by=Math.max(y0,y1);
    for(let y=ay;y<=by;y++)for(let x=ax;x<=bx_;x++){
      if(tMode==='box'&&x>ax&&x<bx_&&y>ay&&y<by)continue;
      out.push(x,y);
      if(edSym)out.push(x,EH-1-y);
    }
  }
  return out;
}
function edFloodFill(sx,sy,newMat){
  if(sx<0||sy<0||sx>=EW||sy>=EH)return;
  const target=edGrid[sy*EW+sx];
  if(target===newMat)return;
  const vis=new Uint8Array(EW*EH),q=new Int32Array(EW*EH);
  let h=0,t=0;vis[sy*EW+sx]=1;q[t++]=sy*EW+sx;
  while(h<t){
    const c=q[h++],x=c%EW,y=(c/EW)|0;
    edGrid[c]=newMat;
    if(x>0&&!vis[c-1]&&edGrid[c-1]===target){vis[c-1]=1;q[t++]=c-1;}
    if(x<EW-1&&!vis[c+1]&&edGrid[c+1]===target){vis[c+1]=1;q[t++]=c+1;}
    if(y>0&&!vis[c-EW]&&edGrid[c-EW]===target){vis[c-EW]=1;q[t++]=c-EW;}
    if(y<EH-1&&!vis[c+EW]&&edGrid[c+EW]===target){vis[c+EW]=1;q[t++]=c+EW;}
  }
}

function edDraw(){
  ex.fillStyle='#06080c';ex.fillRect(0,0,edc.width,edc.height);
  for(let y=0;y<EH;y++)for(let x=0;x<EW;x++){
    const m=edGrid[y*EW+x];
    if(m){const c=MAT[m].c;ex.fillStyle='rgb('+c[0]+','+c[1]+','+c[2]+')';ex.fillRect(x*ECS+1,y*ECS+1,ECS-2,ECS-2);}
  }
  if(edTool!=='fill'){
    const x0=(edDown&&edStart)?edStart.x:edCur.x;
    const y0=(edDown&&edStart)?edStart.y:edCur.y;
    const cells=getEdCells(edTool,x0,y0,edCur.x,edCur.y,edSz);
    const mc=MAT[edMat].c;
    ex.fillStyle=edTool==='erase'?'rgba(255,75,70,0.5)':'rgba('+mc[0]+','+mc[1]+','+mc[2]+',0.55)';
    for(let i=0;i<cells.length;i+=2){
      const x=cells[i],y=cells[i+1];
      if(x>=0&&y>=0&&x<EW&&y<EH)ex.fillRect(x*ECS+1,y*ECS+1,ECS-2,ECS-2);
    }
  }
  ex.strokeStyle='#1f2637';ex.lineWidth=1;ex.beginPath();
  for(let x=0;x<=EW;x++){ex.moveTo(x*ECS+.5,0);ex.lineTo(x*ECS+.5,edc.height);}
  for(let y=0;y<=EH;y++){ex.moveTo(0,y*ECS+.5);ex.lineTo(edc.width,y*ECS+.5);}
  ex.stroke();
  if(edSym){
    ex.strokeStyle='rgba(217,138,43,0.45)';ex.beginPath();
    ex.moveTo(0,edc.height/2);ex.lineTo(edc.width,edc.height/2);ex.stroke();
  }
  $('edinfo').textContent=EW+'x'+EH+' кл. · '+(edTool==='erase'?'Ластик':MAT[edMat].n);
}

function edPos(e){
  const r=edc.getBoundingClientRect();
  return {
    x:Math.max(0,Math.min(EW-1,(((e.clientX-r.left)/r.width)*EW)|0)),
    y:Math.max(0,Math.min(EH-1,(((e.clientY-r.top)/r.height)*EH)|0))
  };
}
edc.addEventListener('pointerdown',e=>{

    const cells=getEdCells(edTool,p.x,p.y,p.x,p.y,edSz);

    }

    edFloodFill(p.x,p.y,edMat);
    edDown=false;
  }
  edDraw();
});
edc.addEventListener('pointermove',e=>{

  }

});
addEventListener('pointerup',()=>{

      const x=cells[i],y=cells[i+1];
      if(x>=0&&y>=0&&x<EW&&y<EH)edGrid[y*EW+x]=edMat;
    }

  edDown=false;edStart=null;edDraw();
